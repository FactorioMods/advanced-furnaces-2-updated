[mod-setting-description]
load-furn-easy-research=Samazina uzlaboto krāšņu tehnoloģiju izpētes izmaksas. Pēc noklusējuma atspējots.
logist=Iespējo komplektā iekļautās iekrāvēju pakāpes un PRO konveijerus. Pēc noklusējuma iespējots.
load-furn-legacy=Pievieno atbalstīto kausēšanas recepšu kopijas lielākām partijām un mantoto produktivitātes saderību. Sastāvdaļu daudzumi, iznākums un ražošanas laiks tiek mērogoti kopā. Pēc noklusējuma atspējots.
load-furn-energy=Reizina krāšņu enerģijas patēriņu. Noklusējums: 1. Diapazons: no 0.1 līdz 5.
load-furn-crafting-speed=Krāšņu ražošanas ātruma mērogs. Bez mantotās partiju ražošanas no konveijera atvasinātais ātrums tiek dalīts ar šo vērtību. Mantotajā režīmā pamata ātrums tiek reizināts ar to. Noklusējums: 1. Diapazons: no 0.1 līdz 5.
load-furn-pollution-speed=Reizina krāšņu piesārņojumu. Ražošanas ātruma mērogs ietekmē arī emisijas. Noklusējums: 1. Diapazons: no 0.001 līdz 10.
loader-pro-use-trains=Atspējots: vagoni netiek krauti. Tikai automātiskie: iekrauj vai izkrauj automātiskos vilcienus, kas apstājušies stacijā. Visi apturētie vilcieni: ietver arī apturētus manuāli vadītus vilcienus. Atbalsta vagonu izvietojumu galvenajos debess virzienos. Noklusējums: atspējots.
recipe-wood-to-coal=Ogļu daudzums, ko saražo no 1 koksnes vienības 10 sekundēs. Nepieciešama koksnes pārvēršanas oglēs recepte. Noklusējums: 8. Diapazons: no 1 līdz 200.
steel-plate2=Iespējo uzlabotās krāsns recepti, kas ražo tēraudu tieši no dzelzsrūdas. Pēc noklusējuma iespējots.
cool=Iespējo recepti, kas pārvērš koksni oglēs. Pēc noklusējuma iespējots.
load-furn-balance-mode=Izvēlas krāšņu izpētes gaitu. Sākotnējā saglabā sākotnējās prasības. Paplašinājumu profili pievieno savas zinātnes paketes un priekšnosacījumus. Trūkstošu paplašinājumu vietā tiek izmantots pieejamais saturs; neatrisinātu prasību gadījumā tiek saglabāta sākotnējā izpēte. Pabeigtā izpēte tiek saglabāta.
load-furn-steel-yield=Tērauda stieņu daudzums, ko saražo no 5 dzelzsrūdas vienībām 16 sekundēs. Nepieciešama tiešā tērauda kausēšana. Noklusējums: 1. Diapazons: no 1 līdz 100. Mantotā partiju ražošana mērogo sastāvdaļas, laiku un iznākumu kopā.
load-furn-extra-smelting=Ļauj uzlabotajās krāsnīs izmantot piemērotas uzstādīto modifikāciju receptes, kas no rūdas ražo plāksnes, un pievieno tiešas tērauda ražošanas alternatīvas piemērotām dzelzi saturošām rūdām. Saglabā rūdas daudzumus un kopējo ražošanas laiku. Nepieciešamas gan avota tehnoloģijas, gan pirmā uzlabotā krāsns. Neietver šķidrumus, nejaušus rezultātus, blakusproduktus, pārstrādi un ķīmiskus procesus. Pēc noklusējuma atspējots.

