[mod-setting-description]
load-furn-easy-research=Verminder die navorsingskoste van gevorderde oondtegnologieë. By verstek gedeaktiveer.
logist=Aktiveer die ingeslote laaiervlakke en PRO-vervoerbande. By verstek geaktiveer.
load-furn-legacy=Voeg kopieë van ondersteunde smeltresepte met groter lotte en die ou produktiwiteitsversoenbaarheid by. Bestanddeelhoeveelhede, opbrengs en vervaardigingstyd word saam geskaal. By verstek gedeaktiveer.
load-furn-energy=Vermenigvuldig die energieverbruik van oonde. Verstek: 1. Reeks: 0.1 tot 5.
load-furn-crafting-speed=Faktor vir die vervaardigingspoed van oonde. Sonder die ou lotresepte word die spoed wat van die vervoerband afgelei word deur hierdie waarde gedeel. In die ou modus word die basisspoed daarmee vermenigvuldig. Verstek: 1. Reeks: 0.1 tot 5.
load-furn-pollution-speed=Vermenigvuldig die besoedeling van oonde. Die vervaardigingspoedfaktor beïnvloed ook die vrystellings. Verstek: 1. Reeks: 0.001 tot 10.
loader-pro-use-trains=Gedeaktiveer: geen waens word gelaai nie. Slegs outomaties: laai of ontlaai outomatiese treine wat by 'n stasie stilstaan. Alle stilstaande treine: sluit ook stilstaande handbeheerde treine in. Ondersteun wa-uitlegte in die vier hoofwindrigtings. Verstek: gedeaktiveer.
recipe-wood-to-coal=Steenkool wat uit 1 hout binne 10 sekondes vervaardig word. Vereis die resep vir steenkool uit hout. Verstek: 8. Reeks: 1 tot 200.
steel-plate2=Aktiveer die resep vir gevorderde oonde wat staal direk uit ystererts maak. By verstek geaktiveer.
cool=Aktiveer die resep wat hout in steenkool omskep. By verstek geaktiveer.
load-furn-balance-mode=Kies die navorsingsvordering vir oonde. Oorspronklik behou die oorspronklike vereistes. Uitbreidingsprofiele voeg hul wetenskappakkette en voorvereistes by. Ontbrekende uitbreidings val terug op beskikbare inhoud; as vereistes nie opgelos kan word nie, bly die oorspronklike navorsing behoue. Voltooide navorsing bly behoue.
load-furn-steel-yield=Staalplate wat uit 5 ystererts binne 16 sekondes vervaardig word. Vereis direkte staalsmelting. Verstek: 1. Reeks: 1 tot 100. Ou lotresepte skaal bestanddele, tyd en opbrengs saam.
load-furn-extra-smelting=Laat geskikte erts-na-plaat-resepte van geïnstalleerde mods in gevorderde oonde toe en voeg direkte staalalternatiewe vir geskikte ysterhoudende ertse by. Behou ertshoeveelhede en totale vervaardigingstyd. Vereis sowel die brontegnologieë as die eerste gevorderde oond. Sluit vloeistowwe, lukrake resultate, neweprodukte, herwinning en chemiese prosesse uit. By verstek gedeaktiveer.

