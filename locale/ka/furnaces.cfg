[mod-setting-description]
load-furn-easy-research=ამცირებს მოწინავე სადნობი ღუმელების ტექნოლოგიების კვლევის ღირებულებას. ნაგულისხმევად გამორთულია.
logist=რთავს თანდართული ჩამტვირთავების საფეხურებსა და PRO კონვეიერებს. ნაგულისხმევად ჩართულია.
load-furn-legacy=ამატებს მხარდაჭერილი დნობის რეცეპტების უფრო დიდი პარტიების ასლებსა და ძველ თავსებადობას პროდუქტიულობასთან. ინგრედიენტების რაოდენობა, გამოსავალი და დამზადების დრო ერთად მასშტაბირდება. ნაგულისხმევად გამორთულია.
load-furn-energy=ამრავლებს ღუმლის ენერგომოხმარებას. ნაგულისხმევი: 1. დიაპაზონი: 0.1-დან 5-მდე.
load-furn-crafting-speed=ღუმლის დამზადების სიჩქარის მასშტაბი. ძველი პარტიული რეჟიმის გარეშე, კონვეიერიდან მიღებული სიჩქარე იყოფა ამ მნიშვნელობაზე. ძველ რეჟიმში საბაზისო სიჩქარე მრავლდება მასზე. ნაგულისხმევი: 1. დიაპაზონი: 0.1-დან 5-მდე.
load-furn-pollution-speed=ამრავლებს ღუმლის დაბინძურებას. დამზადების სიჩქარის მასშტაბიც მოქმედებს ემისიებზე. ნაგულისხმევი: 1. დიაპაზონი: 0.001-დან 10-მდე.
loader-pro-use-trains=გამორთული: ვაგონები არ იტვირთება. მხოლოდ ავტომატური: ტვირთავს ან ცლის სადგურზე გაჩერებულ ავტომატურ მატარებლებს. ყველა გაჩერებული მატარებელი: მოიცავს ხელით მართვად გაჩერებულ მატარებლებსაც. მხარს უჭერს ვაგონების განლაგებას ოთხი ძირითადი მიმართულებით. ნაგულისხმევი: გამორთული.
recipe-wood-to-coal=1 ხისგან 10 წამში წარმოებული ქვანახშირი. მოითხოვს ხის ქვანახშირად გარდაქმნის რეცეპტს. ნაგულისხმევი: 8. დიაპაზონი: 1-დან 200-მდე.
steel-plate2=რთავს მოწინავე ღუმლის რეცეპტს, რომელიც ფოლადს უშუალოდ რკინის მადნიდან ამზადებს. ნაგულისხმევად ჩართულია.
cool=რთავს ხის ქვანახშირად გარდაქმნის რეცეპტს. ნაგულისხმევად ჩართულია.
load-furn-balance-mode=ირჩევს ღუმლის კვლევის განვითარების გზას. ორიგინალი ინარჩუნებს თავდაპირველ მოთხოვნებს. გაფართოებების პროფილები ამატებს საკუთარ სამეცნიერო პაკეტებსა და წინაპირობებს. არარსებული გაფართოებების ნაცვლად გამოიყენება ხელმისაწვდომი შიგთავსი; თუ მოთხოვნები ვერ განისაზღვრა, რჩება თავდაპირველი კვლევა. დასრულებული კვლევები შენარჩუნდება.
load-furn-steel-yield=5 რკინის მადნიდან 16 წამში წარმოებული ფოლადის ფირფიტები. მოითხოვს ფოლადის პირდაპირ დნობას. ნაგულისხმევი: 1. დიაპაზონი: 1-დან 100-მდე. ძველი პარტიული რეჟიმი ინგრედიენტებს, დროსა და გამოსავალს ერთად მასშტაბირებს.
load-furn-extra-smelting=მოწინავე ღუმლებში უშვებს დაყენებული მოდების შესაბამის რეცეპტებს მადნიდან ფირფიტების მისაღებად და ამატებს პირდაპირი ფოლადის ალტერნატივებს შესაფერისი რკინის შემცველი მადნებისთვის. ინარჩუნებს მადნის რაოდენობასა და დამზადების მთლიან დროს. მოითხოვს როგორც საწყის ტექნოლოგიებს, ისე პირველ მოწინავე ღუმელს. გამორიცხავს სითხეებს, შემთხვევით შედეგებს, თანაპროდუქტებს, გადამუშავებასა და ქიმიურ პროცესებს. ნაგულისხმევად გამორთულია.

