[mod-setting-description]
load-furn-easy-research=Намалява цената за изследване на технологиите за усъвършенствани пещи. Изключено по подразбиране.
logist=Включва вградените нива товарачи и лентите PRO. Включено по подразбиране.
load-furn-legacy=Добавя копия на поддържаните рецепти за топене с по-големи партиди и съвместимост с производителността от старите версии. Количествата съставки, добивът и времето за производство се мащабират заедно. Изключено по подразбиране.
load-furn-energy=Умножава енергопотреблението на пещите. По подразбиране: 1. Диапазон: от 0.1 до 5.
load-furn-crafting-speed=Коефициент за скоростта на производство на пещите. Без партидните рецепти от старите версии скоростта, изчислена според лентата, се дели на тази стойност. В стария режим базовата скорост се умножава по нея. По подразбиране: 1. Диапазон: от 0.1 до 5.
load-furn-pollution-speed=Умножава замърсяването от пещите. Коефициентът на скоростта на производство също влияе на емисиите. По подразбиране: 1. Диапазон: от 0.001 до 10.
loader-pro-use-trains=Изключено: без товарене на вагони. Само автоматични: товари или разтоварва влакове в автоматичен режим, спрели на гара. Всички спрели влакове: включва и спрелите влакове в ръчен режим. Поддържат се вагони, ориентирани по основните посоки на света. По подразбиране: изключено.
recipe-wood-to-coal=Въглища, произведени от 1 единица дървесина за 10 секунди. Изисква рецептата за въглища от дървесина. По подразбиране: 8. Диапазон: от 1 до 200.
steel-plate2=Включва рецептата на усъвършенстваната пещ за производство на стомана директно от желязна руда. Включено по подразбиране.
cool=Включва рецептата за превръщане на дървесина във въглища. Включено по подразбиране.
load-furn-balance-mode=Избира последователността на изследванията за пещите. Оригиналният профил запазва първоначалните изисквания. Профилите за разширения добавят съответните научни пакети и предварителни изисквания. При липсващи разширения се използва наличното съдържание; ако изискванията не могат да бъдат определени, се запазва оригиналното изследване. Завършените изследвания се запазват.
load-furn-steel-yield=Стоманени плочи, произведени от 5 единици желязна руда за 16 секунди. Изисква директното топене на стомана. По подразбиране: 1. Диапазон: от 1 до 100. Партидните рецепти от старите версии мащабират заедно съставките, времето и добива.
load-furn-extra-smelting=Позволява подходящи рецепти за плочи от руда от инсталирани модификации в усъвършенстваните пещи и добавя варианти за директна стомана от подходящи желязосъдържащи руди. Запазва количествата руда и общото време за производство. Изисква както изходните технологии, така и първата усъвършенствана пещ. Изключва течности, случайни резултати, странични продукти, рециклиране и химични процеси. Изключено по подразбиране.

