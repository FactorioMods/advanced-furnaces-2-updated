[mod-setting-description]
logist=Descarregadores e correias transportadoras da mod
result-count=O tempo de elaboração, os ingredientes, a quantidade de produtos multiplicados por 2
load-furn-easy-research=Marque a caixa se quiser reduzir o custo da tecnologia; o padrão é desativado.
load-furn-legacy=Adiciona receitas de Forno * 10, aumenta a velocidade de criação de Fornos, desbloqueia módulos de produtividade para receitas e efeitos de farol.
load-furn-energy=Multiplica o consumo de energia pelo valor definido, de 0.1 a 5.0, padrão 1.0
load-furn-crafting-speed=Permite ajustar a velocidade de fabricação. Multiplicado pelo número definido. Padrão 1.0, mínimo 0.1, máximo 5.0
load-furn-pollution-speed=Permite ajustar a velocidade da poluição. Multiplicado pela velocidade de fabricação e pelo número definido. Padrão 1.0, mínimo 0.001, máximo 10.0
loader-pro-use-trains=Usa muito poder de processamento, pois precisa colocar itens no script\n\ntodos os trens (all trains):\nQualquer vagão de carga funciona com carregadores\n\napenas automático (auto-only):\nApenas trens em modo automático são utilizados\n\ndesativado (disabled): (padrão)\nOs trens são ignorados pelos carregadores
steel-plate2=Ativar receita especial que produz mais chapas de ferro
cool=Ativar receita especial que produz carvão da madeira
recipe-wood-to-coal=Altere quanto 1 madeira pode se transformar em carvão, padrão é 8, mínimo 1 máximo 200