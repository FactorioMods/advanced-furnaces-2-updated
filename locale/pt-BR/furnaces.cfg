[mod-setting-description]
load-furn-easy-research=Reduz o custo de pesquisa das tecnologias de fornalhas avançadas. Desativado por padrão.
logist=Ativa os níveis de carregadores e as esteiras PRO incluídos. Ativado por padrão.
load-furn-legacy=Adiciona cópias das receitas de fundição compatíveis com lotes maiores e a compatibilidade antiga com produtividade. As quantidades de ingredientes, os produtos e o tempo de fabricação são ajustados em conjunto. Desativado por padrão.
load-furn-energy=Multiplica o consumo de energia das fornalhas. Padrão: 1. Intervalo: de 0.1 a 5.
load-furn-crafting-speed=Fator usado para a velocidade de fabricação das fornalhas. Sem os lotes do modo antigo, a velocidade derivada da esteira é dividida por este valor. No modo antigo, a velocidade base é multiplicada por ele. Padrão: 1. Intervalo: de 0.1 a 5.
load-furn-pollution-speed=Multiplica a poluição das fornalhas. O fator de velocidade de fabricação também afeta as emissões. Padrão: 1. Intervalo: de 0.001 a 10.
loader-pro-use-trains=Desativado: nenhum carregamento de vagões. Somente automáticos: carrega ou descarrega trens automáticos parados em uma estação. Todos os trens parados: também inclui trens manuais parados. Aceita disposições de vagões orientadas pelos pontos cardeais. Padrão: desativado.
recipe-wood-to-coal=Carvão produzido a partir de 1 unidade de madeira em 10 segundos. Requer a receita de carvão a partir de madeira. Padrão: 8. Intervalo: de 1 a 200.
steel-plate2=Ativa a receita das fornalhas avançadas que produz aço diretamente do minério de ferro. Ativado por padrão.
cool=Ativa a receita que transforma madeira em carvão. Ativado por padrão.
load-furn-balance-mode=Escolhe a progressão da pesquisa das fornalhas. Original mantém os requisitos originais. Os perfis de expansão adicionam seus pacotes científicos e pré-requisitos. Se faltarem expansões, o conteúdo disponível será usado; se os requisitos não puderem ser resolvidos, a pesquisa original será mantida. As pesquisas concluídas são preservadas.
load-furn-steel-yield=Vigas de aço produzidas a partir de 5 minérios de ferro em 16 segundos. Requer a fundição direta de aço. Padrão: 1. Intervalo: de 1 a 100. Os lotes do modo antigo ajustam ingredientes, tempo e produtos em conjunto.
load-furn-extra-smelting=Permite nas fornalhas avançadas as receitas adequadas de minério para chapa dos mods instalados e adiciona alternativas de aço direto para minérios ferrosos adequados. Preserva as quantidades de minério e o tempo total de fabricação. Requer tanto as tecnologias de origem quanto a primeira fornalha avançada. Exclui fluidos, resultados aleatórios, subprodutos, reciclagem e processos químicos. Desativado por padrão.

