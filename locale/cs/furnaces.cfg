[mod-setting-description]
load-furn-easy-research=Snižuje náklady na výzkum technologií pokročilých pecí. Ve výchozím nastavení vypnuto.
logist=Povoluje přibalené úrovně nakladačů a pásy PRO. Ve výchozím nastavení zapnuto.
load-furn-legacy=Přidává kopie podporovaných tavicích receptů s většími dávkami a kompatibilitu s produktivitou ze starších verzí. Množství surovin, výstup a doba výroby se mění ve stejném poměru. Ve výchozím nastavení vypnuto.
load-furn-energy=Násobí spotřebu energie pecí. Výchozí hodnota: 1. Rozsah: 0.1 až 5.
load-furn-crafting-speed=Koeficient rychlosti výroby pecí. Bez dávkových receptů ze starších verzí se rychlost odvozená od pásu dělí touto hodnotou. Ve starším režimu se jí násobí základní rychlost. Výchozí hodnota: 1. Rozsah: 0.1 až 5.
load-furn-pollution-speed=Násobí znečištění pecí. Emise ovlivňuje také koeficient rychlosti výroby. Výchozí hodnota: 1. Rozsah: 0.001 až 10.
loader-pro-use-trains=Vypnuto: žádné nakládání vagónů. Pouze automatické: nakládá nebo vykládá vlaky v automatickém režimu stojící ve stanici. Všechny stojící vlaky: zahrnuje i stojící vlaky v ručním režimu. Podporuje vagóny orientované podle hlavních světových stran. Výchozí nastavení: vypnuto.
recipe-wood-to-coal=Uhlí vyrobené z 1 kusu dřeva za 10 sekund. Vyžaduje recept na uhlí ze dřeva. Výchozí hodnota: 8. Rozsah: 1 až 200.
steel-plate2=Povoluje recept pokročilé pece na výrobu oceli přímo ze železné rudy. Ve výchozím nastavení zapnuto.
cool=Povoluje recept na přeměnu dřeva na uhlí. Ve výchozím nastavení zapnuto.
load-furn-balance-mode=Volí postup výzkumu pecí. Původní profil zachovává původní požadavky. Profily rozšíření přidávají své vědecké balíčky a předpoklady. Pokud rozšíření chybí, použije se dostupný obsah; pokud nelze požadavky určit, zachová se původní výzkum. Dokončené výzkumy zůstávají zachovány.
load-furn-steel-yield=Ocelové pláty vyrobené z 5 kusů železné rudy za 16 sekund. Vyžaduje přímé tavení oceli. Výchozí hodnota: 1. Rozsah: 1 až 100. Dávkové recepty ze starších verzí mění suroviny, čas a výstup ve stejném poměru.
load-furn-extra-smelting=Umožňuje v pokročilých pecích vhodné recepty na tavení rudy na pláty z nainstalovaných modů a přidává alternativy přímé výroby oceli z vhodných rud obsahujících železo. Zachovává množství rudy i celkovou dobu výroby. Vyžaduje zdrojové technologie i první pokročilou pec. Vylučuje tekutiny, náhodné výsledky, vedlejší produkty, recyklaci a chemické procesy. Ve výchozím nastavení vypnuto.

