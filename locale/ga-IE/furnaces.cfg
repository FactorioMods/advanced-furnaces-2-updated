[mod-setting-description]
load-furn-easy-research=Laghdaíonn sé costas taighde theicneolaíochtaí na bhfoirnéisí ardleibhéil. Díchumasaithe de réir réamhshocraithe.
logist=Cumasaíonn sé na leibhéil lódairí agus na criosanna iompair PRO atá san áireamh. Cumasaithe de réir réamhshocraithe.
load-furn-legacy=Cuireann sé cóipeanna de na hoidis bhruithnithe a dtacaítear leo ar fáil le baisceanna níos mó, chomh maith leis an sean-chomhoiriúnacht táirgiúlachta. Déantar méideanna comhábhar, aschur agus am déantúsaíochta a scálú le chéile. Díchumasaithe de réir réamhshocraithe.
load-furn-energy=Iolraíonn sé tomhaltas fuinnimh na bhfoirnéisí. Réamhshocrú: 1. Raon: 0.1 go 5.
load-furn-crafting-speed=Fachtóir a úsáidtear do luas déantúsaíochta na bhfoirnéisí. Gan baisceanna an tseanmhodha, roinntear an luas a dhíorthaítear ón gcrios iompair ar an luach seo. Sa seanmhodh, iolraítear an bunluas faoin luach seo. Réamhshocrú: 1. Raon: 0.1 go 5.
load-furn-pollution-speed=Iolraíonn sé truailliú na bhfoirnéisí. Bíonn tionchar ag an bhfachtóir luais déantúsaíochta ar na hastaíochtaí freisin. Réamhshocrú: 1. Raon: 0.001 go 10.
loader-pro-use-trains=Díchumasaithe: ní lódáiltear vaigíní. Uathoibríoch amháin: lódálann nó dílódálann sé traenacha uathoibríocha atá stoptha ag stáisiún. Gach traein stoptha: áirítear traenacha láimhe atá stoptha freisin. Tacaíonn sé le leaganacha amach vaigíní atá ailínithe leis na ceithre phríomhaird. Réamhshocrú: díchumasaithe.
recipe-wood-to-coal=Gual a tháirgtear as 1 aonad adhmaid i 10 soicind. Teastaíonn an t-oideas chun gual a dhéanamh as adhmad. Réamhshocrú: 8. Raon: 1 go 200.
steel-plate2=Cumasaíonn sé oideas na bhfoirnéisí ardleibhéil a dhéanann cruach go díreach ó amhiarann. Cumasaithe de réir réamhshocraithe.
cool=Cumasaíonn sé an t-oideas a athraíonn adhmad ina ghual. Cumasaithe de réir réamhshocraithe.
load-furn-balance-mode=Roghnaíonn sé dul chun cinn taighde na bhfoirnéisí. Coinníonn Bunleagan na bunriachtanais. Cuireann próifílí na leathnuithe a bpacáistí eolaíochta agus a réamhriachtanais leis. Mura bhfuil leathnuithe ar fáil, úsáidtear an t-ábhar atá ar fáil; mura féidir riachtanais a réiteach, coinnítear an buntaighde. Coinnítear taighde atá críochnaithe.
load-furn-steel-yield=Leaca cruach a tháirgtear as 5 amhiarann i 16 soicind. Teastaíonn bruithniú díreach cruach. Réamhshocrú: 1. Raon: 1 go 100. Scálann baisceanna an tseanmhodha comhábhair, am agus aschur le chéile.
load-furn-extra-smelting=Ceadaíonn sé oidis oiriúnacha ó mhéin go pláta ó mhodhnuithe suiteáilte sna foirnéisí ardleibhéil agus cuireann sé roghanna cruach dírí ar fáil do mhéine oiriúnacha a bhfuil iarann iontu. Caomhnaítear méideanna méine agus an t-am déantúsaíochta iomlán. Teastaíonn na teicneolaíochtaí foinseacha agus an chéad fhoirnéis ardleibhéil araon. Eisiatar sreabháin, torthaí randamacha, fotháirgí, athchúrsáil agus próisis cheimiceacha. Díchumasaithe de réir réamhshocraithe.

