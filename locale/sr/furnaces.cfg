[mod-setting-description]
load-furn-easy-research=Смањује трошкове истраживања технологија напредних пећи. Подразумевано искључено.
logist=Омогућава приложене нивое утоваривача и траке PRO. Подразумевано укључено.
load-furn-legacy=Додаје копије подржаних рецепата за топљење са већим серијама и компатибилност са продуктивношћу из старијих верзија. Количине састојака, излазна количина и време производње мењају се заједно у истој размери. Подразумевано искључено.
load-furn-energy=Множи потрошњу енергије пећи. Подразумевано: 1. Опсег: од 0.1 до 5.
load-furn-crafting-speed=Фактор брзине производње пећи. Без већих серија из старијих верзија брзина изведена из траке дели се овом вредношћу. У старом режиму основна брзина множи се њоме. Подразумевано: 1. Опсег: од 0.1 до 5.
load-furn-pollution-speed=Множи загађење пећи. Фактор брзине производње такође утиче на емисије. Подразумевано: 1. Опсег: од 0.001 до 10.
loader-pro-use-trains=Искључено: нема утовара вагона. Само аутоматски: утоварује или истоварује возове у аутоматском режиму заустављене на станици. Сви заустављени возови: укључује и заустављене возове у ручном режиму. Подржава вагоне усмерене према главним странама света. Подразумевано: искључено.
recipe-wood-to-coal=Угаљ произведен од 1 јединице дрвета за 10 секунди. Захтева рецепт за угаљ од дрвета. Подразумевано: 8. Опсег: од 1 до 200.
steel-plate2=Омогућава рецепт напредне пећи који производи челик директно из руде гвожђа. Подразумевано укључено.
cool=Омогућава рецепт који претвара дрво у угаљ. Подразумевано укључено.
load-furn-balance-mode=Бира ток истраживања пећи. Оригинални профил задржава оригиналне захтеве. Профили проширења додају своје научне пакете и предуслове. Ако проширења недостају, користи се доступан садржај; ако захтеви не могу да се одреде, задржава се оригинално истраживање. Завршена истраживања остају сачувана.
load-furn-steel-yield=Челичне плоче произведене из 5 јединица руде гвожђа за 16 секунди. Захтева директно топљење челика. Подразумевано: 1. Опсег: од 1 до 100. Веће серије из старијих верзија заједно мењају састојке, време и излазну количину у истој размери.
load-furn-extra-smelting=Омогућава одговарајуће рецепте за топљење руде у плоче из инсталираних модова у напредним пећима и додаје варијанте директне производње челика за одговарајуће руде које садрже гвожђе. Чува количине руде и укупно време производње. Захтева и изворне технологије и прву напредну пећ. Искључује течности, насумичне резултате, споредне производе, рециклажу и хемијске процесе. Подразумевано искључено.

