[mod-setting-description]
load-furn-easy-research=Reduz o custo de investigação das tecnologias de fornalhas avançadas. Desativado por predefinição.
logist=Ativa os níveis de carregadores e os tapetes rolantes PRO incluídos. Ativado por predefinição.
load-furn-legacy=Adiciona cópias das receitas de fundição compatíveis com lotes maiores e a compatibilidade antiga com a produtividade. As quantidades de ingredientes, os produtos e o tempo de fabrico são ajustados em conjunto. Desativado por predefinição.
load-furn-energy=Multiplica o consumo de energia das fornalhas. Predefinição: 1. Intervalo: de 0.1 a 5.
load-furn-crafting-speed=Fator utilizado para a velocidade de fabrico das fornalhas. Sem os lotes do modo antigo, a velocidade derivada do tapete rolante é dividida por este valor. No modo antigo, a velocidade base é multiplicada por ele. Predefinição: 1. Intervalo: de 0.1 a 5.
load-furn-pollution-speed=Multiplica a poluição das fornalhas. O fator da velocidade de fabrico também afeta as emissões. Predefinição: 1. Intervalo: de 0.001 a 10.
loader-pro-use-trains=Desativado: sem carregamento de vagões. Apenas automáticos: carrega ou descarrega comboios automáticos parados numa estação. Todos os comboios parados: inclui também comboios manuais parados. Suporta disposições de vagões orientadas pelos pontos cardeais. Predefinição: desativado.
recipe-wood-to-coal=Carvão produzido a partir de 1 unidade de madeira em 10 segundos. Requer a receita de carvão a partir de madeira. Predefinição: 8. Intervalo: de 1 a 200.
steel-plate2=Ativa a receita das fornalhas avançadas que produz aço diretamente do minério de ferro. Ativado por predefinição.
cool=Ativa a receita que transforma madeira em carvão. Ativado por predefinição.
load-furn-balance-mode=Escolhe a progressão da investigação das fornalhas. Original mantém os requisitos originais. Os perfis de expansão acrescentam os seus pacotes científicos e pré-requisitos. Se faltarem expansões, é utilizado o conteúdo disponível; se não for possível resolver os requisitos, mantém-se a investigação original. As investigações concluídas são preservadas.
load-furn-steel-yield=Chapas de aço produzidas a partir de 5 minérios de ferro em 16 segundos. Requer a fundição direta de aço. Predefinição: 1. Intervalo: de 1 a 100. Os lotes do modo antigo ajustam os ingredientes, o tempo e os produtos em conjunto.
load-furn-extra-smelting=Permite nas fornalhas avançadas as receitas adequadas de minério para chapa dos mods instalados e acrescenta alternativas de aço direto para minérios ferrosos adequados. Preserva as quantidades de minério e o tempo total de fabrico. Requer tanto as tecnologias de origem como a primeira fornalha avançada. Exclui fluidos, resultados aleatórios, subprodutos, reciclagem e processos químicos. Desativado por predefinição.

