[mod-setting-description]
logist=Добавляет погрузчики и транспортные ленты
load-furn-easy-research=Поставьте флажок, если вы хотите уменьшить стоимость технологий, по умолчанию выкл.
load-furn-legacy=Добавляет рецепты печей * 10, увеличивает скорость крафта печей, разблокирует модули продуктивности для рецептов и эффектов маяков.
load-furn-energy=Умножает потребление энергии на установленое значение, по от 0.1 до 5.0, по умолчанию 1.0
load-furn-crafting-speed=Позволяет настроить скорость крафта. Умножается на установленное число. По умолчанию 1.0, минимум 0.1, максимум 5.0
load-furn-pollution-speed=Позволяет настроить скорость загрязнения. Умножается на скорость крафта и установленное число. По умолчанию 1.0, минимум 0.001, максимум 10.0
loader-pro-use-trains=Использует много ресурсов процессора, так как предметы размещаются скриптом\n\nall trains (все поезда):\nЛюбой грузовой вагон работает с погрузчиками\n\nauto-only (только автоматические):\nИспользуются только поезда в автоматическом режиме\n\ndisabled (отключено): (по умолчанию)\nПоезда игнорируются погрузчиками
steel-plate2=Включить специальный рецепт, который производит больше железных пластин
cool=Включить специальный рецепт, который производит уголь из дерева
recipe-wood-to-coal=Изменить сколько 1 дерево может превратиться в уголь, по умолчанию 8, минимум 1 максимум 200