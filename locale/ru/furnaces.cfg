[mod-setting-description]
load-furn-easy-research=Снижает стоимость исследования технологий усовершенствованных печей. По умолчанию выключено.
logist=Включает встроенные уровни погрузчиков и конвейеры PRO. По умолчанию включено.
load-furn-legacy=Добавляет копии поддерживаемых рецептов плавки с увеличенными партиями и совместимость с продуктивностью прежних версий. Количество ингредиентов, выход продукции и время производства масштабируются совместно. По умолчанию выключено.
load-furn-energy=Умножает энергопотребление печей. По умолчанию: 1. Диапазон: от 0.1 до 5.
load-furn-crafting-speed=Коэффициент скорости производства печей. Без пакетных рецептов прежних версий скорость, рассчитанная по конвейеру, делится на это значение. В режиме прежних версий базовая скорость умножается на него. По умолчанию: 1. Диапазон: от 0.1 до 5.
load-furn-pollution-speed=Умножает загрязнение от печей. Коэффициент скорости производства также влияет на выбросы. По умолчанию: 1. Диапазон: от 0.001 до 10.
loader-pro-use-trains=Выключено: загрузка вагонов отключена. Только автоматические: загружает или разгружает поезда в автоматическом режиме, остановившиеся на станции. Все остановившиеся поезда: также включает остановившиеся поезда в ручном режиме. Поддерживаются вагоны, ориентированные по сторонам света. По умолчанию: выключено.
recipe-wood-to-coal=Количество угля, получаемого из 1 единицы древесины за 10 секунд. Требуется рецепт угля из древесины. По умолчанию: 8. Диапазон: от 1 до 200.
steel-plate2=Включает рецепт усовершенствованной печи для производства стали напрямую из железной руды. По умолчанию включено.
cool=Включает рецепт переработки древесины в уголь. По умолчанию включено.
load-furn-balance-mode=Выбирает последовательность исследования печей. Исходный профиль сохраняет исходные требования. Профили дополнений добавляют соответствующие исследовательские пакеты и предварительные условия. При отсутствии дополнений используется доступный контент; если требования не удаётся определить, сохраняется исходное исследование. Завершённые исследования сохраняются.
load-furn-steel-yield=Количество стальных балок, получаемых из 5 единиц железной руды за 16 секунд. Требуется прямая выплавка стали. По умолчанию: 1. Диапазон: от 1 до 100. Пакетные рецепты прежних версий совместно масштабируют ингредиенты, время и выход продукции.
load-furn-extra-smelting=Разрешает подходящие рецепты выплавки плит из руды из установленных модов в усовершенствованных печах и добавляет варианты прямой выплавки стали из подходящих железосодержащих руд. Сохраняет количество руды и общее время производства. Требуются как исходные технологии, так и первая усовершенствованная печь. Исключает жидкости, случайные результаты, побочные продукты, переработку вторсырья и химические процессы. По умолчанию выключено.

