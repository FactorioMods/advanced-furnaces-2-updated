[mod-setting-description]
load-furn-easy-research=Lækkar rannsóknarkostnað háþróaðrar bræðsluofnatækni. Óvirkt sjálfgefið.
logist=Virkjar meðfylgjandi stig hlaðara og PRO-færibönd. Virkt sjálfgefið.
load-furn-legacy=Bætir við afritum af studdum bræðsluuppskriftum með stærri lotum og eldri samhæfni við framleiðniaukningu. Magn hráefna, afurða og framleiðslutími kvarðast saman. Óvirkt sjálfgefið.
load-furn-energy=Margfaldar orkunotkun bræðsluofna. Sjálfgefið: 1. Bil: 0.1 til 5.
load-furn-crafting-speed=Kvörðun framleiðsluhraða bræðsluofna. Án eldri lotuuppskrifta er hraða sem leiðir af færibandi deilt með þessu gildi. Í eldri ham er grunnhraði margfaldaður með því. Sjálfgefið: 1. Bil: 0.1 til 5.
load-furn-pollution-speed=Margfaldar mengun bræðsluofna. Kvörðun framleiðsluhraða hefur einnig áhrif á losun. Sjálfgefið: 1. Bil: 0.001 til 10.
loader-pro-use-trains=Óvirkt: engin hleðsla vagna. Aðeins sjálfvirkar: hleður eða affermir sjálfvirkar lestir sem standa á stöð. Allar kyrrstæðar lestir: nær einnig til kyrrstæðra handstýrðra lesta. Styður vagna sem snúa í höfuðáttir. Sjálfgefið: óvirkt.
recipe-wood-to-coal=Kol sem eru framleidd úr 1 viðareiningu á 10 sekúndum. Krefst uppskriftarinnar sem breytir við í kol. Sjálfgefið: 8. Bil: 1 til 200.
steel-plate2=Virkjar uppskrift háþróaðs bræðsluofns sem framleiðir stál beint úr járngrýti. Virkt sjálfgefið.
cool=Virkjar uppskriftina sem breytir við í kol. Virkt sjálfgefið.
load-furn-balance-mode=Velur framvindu rannsókna á bræðsluofnum. Upprunalegt heldur upprunalegum kröfum. Viðbótarsnið bæta við sínum vísindapökkum og forkröfum. Ef viðbætur vantar er tiltækt efni notað; óleystar kröfur halda upprunalegum rannsóknum. Loknum rannsóknum er haldið.
load-furn-steel-yield=Stálplötur sem eru framleiddar úr 5 einingum járngrýtis á 16 sekúndum. Krefst beinnar stálbræðslu. Sjálfgefið: 1. Bil: 1 til 100. Eldri lotuuppskriftir kvarða hráefni, tíma og afurðir saman.
load-furn-extra-smelting=Leyfir viðeigandi uppskriftir úr uppsettum breytingum sem breyta málmgrýti í plötur í háþróuðum bræðsluofnum og bætir við beinum stálkostum fyrir viðeigandi járnberandi málmgrýti. Varðveitir magn málmgrýtis og heildarframleiðslutíma. Krefst bæði upprunatækni og fyrsta háþróaða bræðsluofnsins. Undanskilur vökva, tilviljanakenndar niðurstöður, aukaafurðir, endurvinnslu og efnaferli. Óvirkt sjálfgefið.

