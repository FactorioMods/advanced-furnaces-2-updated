[mod-setting-description]
load-furn-easy-research=.ةمدقتملا رهصلا نارفأ تاينقت ثحب ةفلكت لّلقي\n.اًيضارتفا لّطعم
logist=.ةنّمضملا PRO تالقانو تامّقلُملا تايوتسم لّعفي\n.اًيضارتفا لّعفم
load-furn-legacy=ةموعدملا رهصلا تافصو نم ربكأ تاعفدب اًخسن فيضي\nتانوكملا تايمك بسانتت .ميدقلا ةيجاتنإلا قفاوتو\n.اًيضارتفا لّطعم .اًعم عينصتلا تقوو جتانلاو
load-furn-energy=.لماعملا اذه يف نرفلا ةقاط كالهتسا برضي\n.5 ىلإ 0.1 نم :قاطنلا .1 :يضارتفالا
load-furn-crafting-speed=،ةميدقلا تاعفدلا نود .نرفلا عينصت ةعرس لماعم\n.ةميقلا هذه ىلع مازحلا نم ةقتشملا ةعرسلا مَسقُت\n.اهيف ةيساسألا ةعرسلا بَرضُت ،ميدقلا عضولا يف\n.5 ىلإ 0.1 نم :قاطنلا .1 :يضارتفالا
load-furn-pollution-speed=ةعرس لماعم رثؤي .لماعملا اذه يف نرفلا ثولت برضي\n.1 :يضارتفالا .تاثاعبنالا يف اًضيأ عينصتلا\n.10 ىلإ 0.001 نم :قاطنلا
loader-pro-use-trains=وأ لّمحي :طقف ةيئاقلتلا .تابرعلل ليمحت ال :لّطعم\nعيمج .ةطحم يف ةفقوتملا ةيئاقلتلا تاراطقلا غّرفي\nةيوديلا تاراطقلا اًضيأ لمشي :ةفقوتملا تاراطقلا\nةلصوبلا تاهاجتاب تابرعلا بيترت معدي .ةفقوتملا\n.لّطعم :يضارتفالا .ةعبرألا
recipe-wood-to-coal=ةفصو بلطتي .ٍناوث 10 لالخ ةبشخ 1 نم جتانلا محفلا\n1 نم :قاطنلا .8 :يضارتفالا .محف ىلإ بشخلا ليوحت\n.200 ىلإ
steel-plate2=ذالوفلا عنصل ةمدقتملا رهصلا نارفأ ةفصو لّعفي\n.اًيضارتفا لّعفم .ديدحلا ماخ نم ًةرشابم
cool=.اًيضارتفا لّعفم .محف ىلإ بشخلا ليوحت ةفصو لّعفي
load-furn-balance-mode=يلصألا ظفتحي .نارفألا ثاحبأ جّردت راتخي\nاهمزح تاعسوتلا تافلم فيضت .ةيلصألا تابلطتملاب\nتاعسوتلا بايغ دنع .ةقباسلا اهتابلطتمو ةيملعلا\nديدحت رّذعت اذإو ؛حاتملا ىوتحملا مدختسُي\nثاحبألا ظفحُت .يلصألا ثحبلاب ظفتحُي تابلطتملا\n.ةلمتكملا
load-furn-steel-yield=ديدحلا ماخ نم تادحو 5 نم ةجتانلا ذالوفلا حئافص\n.ذالوفلل رشابملا رهصلا بلطتي .ةيناث 16 لالخ\nتاعفدلا طبضت .100 ىلإ 1 نم :قاطنلا .1 :يضارتفالا\n.ةدحاو ةبسنب جتانلاو تقولاو تانوكملا ةميدقلا
load-furn-extra-smelting=نم ةمئالملا حئافص ىلإ ماخلا ليوحت تافصوب حمسي\nفيضيو ،ةمدقتملا نارفألا يف ةتبثملا تاليدعتلا\nةمئالملا تاماخلا نم ًةرشابم ذالوفلا جاتنإل لئادب\nماخلا تايمك ىلع ظفاحي .ديدحلا ىلع ةيوتحملا\nنرفلاو ردصملا تاينقت بلطتي .عينصتلا تقو يلامجإو\nجئاتنلاو لئاوسلا ينثتسي .اًعم لوألا مدقتملا\nريودتلا ةداعإو ةيوناثلا جتاونلاو ةيئاوشعلا\n.اًيضارتفا لّطعم .ةيئايميكلا تايلمعلاو

