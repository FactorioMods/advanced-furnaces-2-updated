[mod-setting-description]
load-furn-easy-research=Ferleget de ûndersykskosten fan de avansearre ûnetechnologyen. Standert útskeakele.
logist=Skeakelt de ynbegrepen ladernivo's en PRO-transportbannen yn. Standert ynskeakele.
load-furn-legacy=Foeget kopyen fan stipe smeltresepten mei gruttere partijen en de âlde produktiviteitskompatibiliteit ta. Hoemannichten yngrediïnten, opbringst en produksjetiid wurde mei-inoar skaald. Standert útskeakele.
load-furn-energy=Fermannichfâldiget it enerzjyferbrûk fan ûnen. Standert: 1. Berik: 0.1 oant 5.
load-furn-crafting-speed=Faktor foar de produksjefaasje fan ûnen. Sûnder âlde partijresepten wurdt de fan de transportbân ôflaat faasje troch dizze wearde dield. Yn de âlde modus wurdt de basisfaasje dermei fermannichfâldige. Standert: 1. Berik: 0.1 oant 5.
load-furn-pollution-speed=Fermannichfâldiget de fersmoarging fan ûnen. De produksjefaasje-faktor beynfloedet ek de útstjit. Standert: 1. Berik: 0.001 oant 10.
loader-pro-use-trains=Útskeakele: gjin wagons lade. Allinnich automatysk: laadt of lost automatyske treinen dy't by in stasjon stilstaan. Alle stilsteande treinen: omfettet ek stilsteande hânmjittige treinen. Stipet wagonopstellingen yn de fjouwer haadwynrjochtingen. Standert: útskeakele.
recipe-wood-to-coal=Stienkoal dy't út 1 hout yn 10 sekonden makke wurdt. Fereasket it resept foar stienkoal út hout. Standert: 8. Berik: 1 oant 200.
steel-plate2=Skeakelt it resept foar avansearre ûnen yn dat stiel streekrjocht út izererts makket. Standert ynskeakele.
cool=Skeakelt it resept yn dat hout yn stienkoal omset. Standert ynskeakele.
load-furn-balance-mode=Kiest it ûndersyksferrin foar ûnen. Oarspronklik hâldt de oarspronklike easken oan. Utwreidingsprofilen foegje harren wittenskipspakketten en betingsten ta. By ûntbrekkende útwreidingen wurdt beskikbere ynhâld brûkt; by easken dy't net oplost wurde kinne, bliuwt it oarspronklike ûndersyk behâlden. Foltôge ûndersyk bliuwt behâlden.
load-furn-steel-yield=Stielen platen dy't út 5 izererts yn 16 sekonden makke wurde. Fereasket streekrjocht stiel smelten. Standert: 1. Berik: 1 oant 100. Alde partijresepten skaalje yngrediïnten, tiid en opbringst mei-inoar.
load-furn-extra-smelting=Lit geskikte resepten fan erts nei plaat út ynstallearre mods ta yn avansearre ûnen en foeget alternativen foar streekrjocht stiel ta foar geskikte izerhâldende ertsen. Hâldt de hoemannichten erts en de totale produksjetiid gelyk. Fereasket sawol de boarnetechnologyen as de earste avansearre ûne. Slút floeistoffen, willekeurige resultaten, byprodukten, recycling en gemyske prosessen út. Standert útskeakele.

