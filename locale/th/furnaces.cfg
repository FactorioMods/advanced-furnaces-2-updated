[mod-setting-description]
load-furn-easy-research=ลดต้นทุนการวิจัยเทคโนโลยีเตาถลุงขั้นสูง ปิดใช้งานตามค่าเริ่มต้น
logist=เปิดใช้เครื่องโหลดแต่ละระดับและสายพาน PRO ที่มาพร้อมม็อด เปิดใช้งานตามค่าเริ่มต้น
load-furn-legacy=เพิ่มสำเนาสูตรถลุงที่รองรับในขนาดชุดใหญ่ขึ้นและความเข้ากันได้กับผลิตภาพแบบเดิม ปริมาณวัตถุดิบ ผลผลิต และเวลาผลิตจะปรับตามสัดส่วนเดียวกัน ปิดใช้งานตามค่าเริ่มต้น
load-furn-energy=คูณการใช้พลังงานของเตาถลุง ค่าเริ่มต้น: 1 ช่วง: 0.1 ถึง 5
load-furn-crafting-speed=ค่าปรับความเร็วการผลิตของเตาถลุง หากไม่ใช้การผลิตเป็นชุดแบบเดิม ความเร็วที่คำนวณจากสายพานจะถูกหารด้วยค่านี้ ในโหมดเดิม ความเร็วพื้นฐานจะถูกคูณด้วยค่านี้ ค่าเริ่มต้น: 1 ช่วง: 0.1 ถึง 5
load-furn-pollution-speed=คูณมลพิษของเตาถลุง ค่าปรับความเร็วการผลิตมีผลต่อการปล่อยมลพิษด้วย ค่าเริ่มต้น: 1 ช่วง: 0.001 ถึง 10
loader-pro-use-trains=ปิดใช้งาน: ไม่โหลดตู้สินค้า เฉพาะอัตโนมัติ: โหลดหรือขนถ่ายสินค้าของรถไฟอัตโนมัติที่จอดอยู่ที่สถานี รถไฟที่หยุดทั้งหมด: รวมรถไฟที่ควบคุมด้วยมือและหยุดอยู่ด้วย รองรับการวางตู้สินค้าตามทิศหลักทั้งสี่ ค่าเริ่มต้น: ปิดใช้งาน
recipe-wood-to-coal=ถ่านหินที่ผลิตจากไม้ 1 หน่วยใน 10 วินาที ต้องใช้สูตรเปลี่ยนไม้เป็นถ่านหิน ค่าเริ่มต้น: 8 ช่วง: 1 ถึง 200
steel-plate2=เปิดใช้สูตรของเตาถลุงขั้นสูงที่ผลิตเหล็กกล้าจากแร่เหล็กโดยตรง เปิดใช้งานตามค่าเริ่มต้น
cool=เปิดใช้สูตรเปลี่ยนไม้เป็นถ่านหิน เปิดใช้งานตามค่าเริ่มต้น
load-furn-balance-mode=เลือกลำดับความก้าวหน้าการวิจัยเตาถลุง แบบดั้งเดิมจะคงข้อกำหนดเดิม โปรไฟล์ส่วนขยายจะเพิ่มแพ็กวิทยาศาสตร์และข้อกำหนดเบื้องต้นของส่วนขยายนั้น หากไม่มีส่วนขยายจะใช้เนื้อหาที่มีอยู่แทน หากไม่สามารถหาข้อกำหนดได้จะคงการวิจัยเดิมไว้ การวิจัยที่เสร็จแล้วจะยังคงอยู่
load-furn-steel-yield=แผ่นเหล็กกล้าที่ผลิตจากแร่เหล็ก 5 หน่วยใน 16 วินาที ต้องเปิดการถลุงเหล็กกล้าโดยตรง ค่าเริ่มต้น: 1 ช่วง: 1 ถึง 100 การผลิตเป็นชุดแบบเดิมจะปรับวัตถุดิบ เวลา และผลผลิตตามสัดส่วนเดียวกัน
load-furn-extra-smelting=อนุญาตให้ใช้สูตรแร่เป็นแผ่นโลหะที่เหมาะสมจากม็อดที่ติดตั้งในเตาถลุงขั้นสูง และเพิ่มทางเลือกผลิตเหล็กกล้าโดยตรงจากแร่ที่มีเหล็กและเหมาะสม คงปริมาณแร่และเวลาผลิตรวมไว้ ต้องมีทั้งเทคโนโลยีต้นทางและเตาถลุงขั้นสูงรุ่นแรก ไม่รวมของไหล ผลลัพธ์สุ่ม ผลพลอยได้ การรีไซเคิล และกระบวนการทางเคมี ปิดใช้งานตามค่าเริ่มต้น

