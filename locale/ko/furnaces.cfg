[mod-setting-description]
load-furn-easy-research=고급 용광로 기술의 연구 비용을 줄입니다. 기본적으로 비활성화됩니다.
logist=동봉된 적재기 등급과 PRO 운송 벨트를 활성화합니다. 기본적으로 활성화됩니다.
load-furn-legacy=지원되는 제련 제작법의 대용량 일괄 처리 사본과 구형 생산성 호환 기능을 추가합니다. 재료 수량, 생산량, 제작 시간이 같은 비율로 조정됩니다. 기본적으로 비활성화됩니다.
load-furn-energy=용광로의 에너지 소비량에 이 값을 곱합니다. 기본값: 1. 범위: 0.1~5.
load-furn-crafting-speed=용광로 제작 속도 조정값입니다. 구형 일괄 처리를 사용하지 않으면 벨트에서 산출한 속도를 이 값으로 나눕니다. 구형 모드에서는 기본 속도에 이 값을 곱합니다. 기본값: 1. 범위: 0.1~5.
load-furn-pollution-speed=용광로의 공해량에 이 값을 곱합니다. 제작 속도 조정값도 배출량에 영향을 줍니다. 기본값: 1. 범위: 0.001~10.
loader-pro-use-trains=비활성화: 화물차를 적재하지 않습니다. 자동 열차만: 정거장에 정차한 자동 열차에 화물을 싣거나 내립니다. 모든 정차 열차: 정차한 수동 열차도 포함합니다. 동서남북 방향으로 배치된 화물차를 지원합니다. 기본값: 비활성화.
recipe-wood-to-coal=목재 1개로 10초 동안 생산하는 석탄의 양입니다. 목재를 석탄으로 전환하는 제작법이 필요합니다. 기본값: 8. 범위: 1~200.
steel-plate2=철 광석에서 직접 강철을 만드는 고급 용광로 제작법을 활성화합니다. 기본적으로 활성화됩니다.
cool=목재를 석탄으로 전환하는 제작법을 활성화합니다. 기본적으로 활성화됩니다.
load-furn-balance-mode=용광로 연구 진행 방식을 선택합니다. 원본은 기존 요구 사항을 유지합니다. 확장팩 프로필은 해당 과학 팩과 선행 조건을 추가합니다. 확장팩이 없으면 사용 가능한 콘텐츠를 적용하며, 요구 사항을 해결할 수 없으면 기존 연구를 유지합니다. 완료된 연구는 보존됩니다.
load-furn-steel-yield=철 광석 5개로 16초 동안 생산하는 강철 판의 수입니다. 직접 강철 제련이 필요합니다. 기본값: 1. 범위: 1~100. 구형 일괄 처리는 재료, 시간, 생산량을 같은 비율로 조정합니다.
load-furn-extra-smelting=설치된 모드의 적합한 광석→금속판 제작법을 고급 용광로에서 사용할 수 있게 하고, 적합한 철 함유 광석으로 직접 강철을 만드는 대체 제작법을 추가합니다. 광석 수량과 총 제작 시간을 유지합니다. 원본 기술과 첫 번째 고급 용광로가 모두 필요합니다. 유체, 무작위 결과물, 부산물, 재활용 및 화학 공정은 제외합니다. 기본적으로 비활성화됩니다.

