[mod-setting-description]
load-furn-easy-research=降低進階冶煉爐技術的研究成本。預設停用。
logist=啟用隨附的各級裝卸機與PRO輸送帶。預設啟用。
load-furn-legacy=為支援的冶煉配方加入批次更大的副本，並提供舊版產能相容功能。原料數量、產量與製造時間會按相同比例縮放。預設停用。
load-furn-energy=將冶煉爐能耗乘以此值。預設值：1。範圍：0.1至5。
load-furn-crafting-speed=冶煉爐製造速度的調整值。不使用舊版批次模式時，將依輸送帶計算的速度除以此值。舊版模式下，將基礎速度乘以此值。預設值：1。範圍：0.1至5。
load-furn-pollution-speed=將冶煉爐污染量乘以此值。製造速度調整值也會影響排放量。預設值：1。範圍：0.001至10。
loader-pro-use-trains=停用：不裝卸貨車。僅自動列車：為停靠車站的自動列車裝貨或卸貨。所有已停止的列車：也包含已停止的手動列車。支援朝向東、南、西、北的貨車配置。預設值：停用。
recipe-wood-to-coal=1份木材在10秒內生產的煤數量。需要啟用木材轉煤配方。預設值：8。範圍：1至200。
steel-plate2=啟用進階冶煉爐中從鐵礦直接生產鋼材的配方。預設啟用。
cool=啟用將木材轉換成煤的配方。預設啟用。
load-furn-balance-mode=選擇冶煉爐研究進程。原版保留原有需求。擴充設定會加入對應的科技包與前置條件。缺少擴充內容時會採用可用內容；無法確定需求時保留原有研究。已完成的研究會保留。
load-furn-steel-yield=5份鐵礦在16秒內生產的鋼材數量。需要啟用直接煉鋼。預設值：1。範圍：1至100。舊版批次模式會按相同比例縮放原料、時間與產量。
load-furn-extra-smelting=允許進階冶煉爐使用已安裝模組中合適的礦石製金屬板配方，並為合適的含鐵礦石加入直接煉鋼的替代配方。保留礦石數量與總製造時間。同時需要原配方技術與第一種進階冶煉爐技術。排除流體、隨機產物、副產物、回收及化學製程。預設停用。

