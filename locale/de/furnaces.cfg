[mod-setting-description]
load-furn-easy-research=Verringert die Forschungskosten der fortschrittlichen Ofentechnologien. Standardmäßig deaktiviert.
logist=Aktiviert die mitgelieferten Beladerstufen und PRO-Förderbänder. Standardmäßig aktiviert.
load-furn-legacy=Fügt Kopien unterstützter Schmelzrezepte mit größeren Chargen sowie die bisherige Produktivitätskompatibilität hinzu. Zutatenmengen, Ausbeute und Fertigungszeit werden gemeinsam skaliert. Standardmäßig deaktiviert.
load-furn-energy=Multipliziert den Energieverbrauch der Öfen. Standard: 1. Bereich: 0.1 bis 5.
load-furn-crafting-speed=Faktor für die Fertigungsgeschwindigkeit der Öfen. Ohne alte Chargenrezepte wird die aus dem Fließband abgeleitete Geschwindigkeit durch diesen Wert geteilt. Im alten Modus wird die Grundgeschwindigkeit damit multipliziert. Standard: 1. Bereich: 0.1 bis 5.
load-furn-pollution-speed=Multipliziert die Umweltverschmutzung der Öfen. Der Fertigungsgeschwindigkeitsfaktor beeinflusst ebenfalls die Emissionen. Standard: 1. Bereich: 0.001 bis 10.
loader-pro-use-trains=Deaktiviert: keine Waggonbeladung. Nur automatisch: be- oder entlädt automatische Züge, die an einer Haltestelle stehen. Alle stehenden Züge: schließt auch stehende manuelle Züge ein. Unterstützt Waggonanordnungen in den vier Haupthimmelsrichtungen. Standard: deaktiviert.
recipe-wood-to-coal=Aus 1 Holz in 10 Sekunden erzeugte Kohle. Benötigt das Rezept für Kohle aus Holz. Standard: 8. Bereich: 1 bis 200.
steel-plate2=Aktiviert das Rezept für fortschrittliche Öfen, das Stahl direkt aus Eisenerz erzeugt. Standardmäßig aktiviert.
cool=Aktiviert das Rezept, das Holz in Kohle umwandelt. Standardmäßig aktiviert.
load-furn-balance-mode=Wählt den Forschungsfortschritt der Öfen. Original behält die ursprünglichen Anforderungen bei. Erweiterungsprofile ergänzen ihre Wissenschaftspakete und Voraussetzungen. Bei fehlenden Erweiterungen werden verfügbare Inhalte verwendet; bei nicht auflösbaren Anforderungen bleibt die ursprüngliche Forschung erhalten. Abgeschlossene Forschungen bleiben erhalten.
load-furn-steel-yield=Aus 5 Eisenerz in 16 Sekunden erzeugte Stahlträger. Benötigt die direkte Stahlverhüttung. Standard: 1. Bereich: 1 bis 100. Alte Chargenrezepte skalieren Zutaten, Zeit und Ausbeute gemeinsam.
load-furn-extra-smelting=Erlaubt geeignete Erz-zu-Platte-Rezepte installierter Mods in fortschrittlichen Öfen und ergänzt direkte Stahlalternativen für geeignete eisenhaltige Erze. Erzmengen und gesamte Fertigungszeit bleiben erhalten. Benötigt sowohl die Ursprungstechnologien als auch den ersten fortschrittlichen Ofen. Schließt Flüssigkeiten, Zufallsergebnisse, Nebenprodukte, Recycling und chemische Prozesse aus. Standardmäßig deaktiviert.

