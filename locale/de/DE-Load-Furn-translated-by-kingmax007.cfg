[mod-setting-description]
logist=Fügt Lader und Förderbänder hinzu
load-furn-easy-research=Aktivieren Sie das Kontrollkästchen, wenn Sie die Technologiekosten senken möchten. Die Standardeinstellung ist deaktiviert.
load-furn-legacy=Fügt Ofenrezepte hinzu * 10, beschleunigt das Herstellen von Öfen, schaltet Produktivitätsmodule für Rezepte und Beacon-Effekte frei.
load-furn-energy=Multipliziert den Energieverbrauch mit dem eingestellten Wert, von 0.1 bis 5.0, Standard 1.0
load-furn-crafting-speed=Ermöglicht die Anpassung der Herstellungsgeschwindigkeit. Wird mit dem eingestellten Wert multipliziert. Standard 1.0, Minimum 0.1, Maximum 5.0
load-furn-pollution-speed=Ermöglicht die Anpassung der Verschmutzungsgeschwindigkeit. Wird mit der Herstellungsgeschwindigkeit und dem eingestellten Wert multipliziert. Standard 1.0, Minimum 0.001, Maximum 10.0
loader-pro-use-trains=Verwendet viel Rechenleistung, da Gegenstände per Skript platziert werden müssen\n\nalle Züge:\nJeder Güterwagen funktioniert mit Ladern\n\nnur automatisch:\nNur Züge im automatischen Modus werden verwendet\n\ndeaktiviert: (Standard)\nZüge werden von Ladern ignoriert
steel-plate2=Aktivieren Sie das spezielle Rezept, das mehr Eisenplatten produziert
cool=Aktivieren Sie das spezielle Rezept, das Kohle aus Holz produziert
recipe-wood-to-coal=Ändern Sie, wie viel 1 Holz in Kohle umgewandelt werden kann, Standard ist 8, Minimum 1 Maximum 200