[mod-setting-description]
load-furn-easy-research=Mengurangi biaya penelitian teknologi tungku canggih. Nonaktif secara default.
logist=Mengaktifkan tingkatan pemuat dan konveyor PRO bawaan. Aktif secara default.
load-furn-legacy=Menambahkan salinan resep peleburan yang didukung dengan batch lebih besar serta kompatibilitas produktivitas lama. Jumlah bahan, hasil, dan waktu produksi diskalakan bersama. Nonaktif secara default.
load-furn-energy=Mengalikan konsumsi energi tungku. Default: 1. Rentang: 0.1 hingga 5.
load-furn-crafting-speed=Skala untuk kecepatan produksi tungku. Tanpa batch lama, kecepatan yang diturunkan dari sabuk dibagi dengan nilai ini. Dalam mode lama, kecepatan dasar dikalikan dengannya. Default: 1. Rentang: 0.1 hingga 5.
load-furn-pollution-speed=Mengalikan polusi tungku. Skala kecepatan produksi juga memengaruhi emisi. Default: 1. Rentang: 0.001 hingga 10.
loader-pro-use-trains=Nonaktif: tidak ada pemuatan gerbong. Hanya otomatis: memuat atau membongkar kereta otomatis yang berhenti di stasiun. Semua kereta berhenti: juga mencakup kereta manual yang berhenti. Mendukung tata letak gerbong pada empat arah mata angin utama. Default: nonaktif.
recipe-wood-to-coal=Batu bara yang dihasilkan dari 1 kayu dalam 10 detik. Memerlukan resep kayu menjadi batu bara. Default: 8. Rentang: 1 hingga 200.
steel-plate2=Mengaktifkan resep tungku canggih yang membuat baja langsung dari bijih besi. Aktif secara default.
cool=Mengaktifkan resep yang mengubah kayu menjadi batu bara. Aktif secara default.
load-furn-balance-mode=Memilih perkembangan penelitian tungku. Asli mempertahankan persyaratan awal. Profil ekspansi menambahkan paket sains dan prasyaratnya. Ekspansi yang tidak tersedia digantikan oleh konten yang tersedia; persyaratan yang tidak dapat diselesaikan mempertahankan penelitian asli. Penelitian yang telah selesai tetap tersimpan.
load-furn-steel-yield=Pelat baja yang dihasilkan dari 5 bijih besi dalam 16 detik. Memerlukan peleburan baja langsung. Default: 1. Rentang: 1 hingga 100. Batch lama menskalakan bahan, waktu, dan hasil bersama.
load-furn-extra-smelting=Mengizinkan resep bijih menjadi pelat yang sesuai dari mod terpasang di tungku canggih, serta menambahkan alternatif baja langsung untuk bijih mengandung besi yang sesuai. Mempertahankan jumlah bijih dan total waktu produksi. Memerlukan teknologi sumber sekaligus tungku canggih pertama. Mengecualikan fluida, hasil acak, produk sampingan, daur ulang, dan proses kimia. Nonaktif secara default.

