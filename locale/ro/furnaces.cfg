[mod-setting-description]
load-furn-easy-research=Reduce costul cercetării tehnologiilor pentru furnalele avansate. Dezactivat implicit.
logist=Activează nivelurile de încărcătoare incluse și benzile PRO. Activat implicit.
load-furn-legacy=Adaugă copii ale rețetelor de topire acceptate, cu loturi mai mari, și compatibilitate cu productivitatea din versiunile vechi. Cantitățile de ingrediente, producția și timpul de fabricație se modifică proporțional împreună. Dezactivat implicit.
load-furn-energy=Multiplică consumul de energie al furnalelor. Implicit: 1. Interval: de la 0.1 la 5.
load-furn-crafting-speed=Factor folosit pentru viteza de fabricație a furnalelor. Fără loturile din versiunile vechi, viteza calculată pe baza benzii se împarte la această valoare. În modul vechi, viteza de bază se înmulțește cu ea. Implicit: 1. Interval: de la 0.1 la 5.
load-furn-pollution-speed=Multiplică poluarea furnalelor. Factorul vitezei de fabricație afectează și emisiile. Implicit: 1. Interval: de la 0.001 la 10.
loader-pro-use-trains=Dezactivat: fără încărcarea vagoanelor. Doar automate: încarcă sau descarcă trenurile aflate în modul automat și oprite într-o stație. Toate trenurile oprite: include și trenurile aflate în modul manual care sunt oprite. Acceptă vagoane orientate pe direcțiile cardinale. Implicit: dezactivat.
recipe-wood-to-coal=Cărbune produs din 1 unitate de lemn în 10 secunde. Necesită rețeta de cărbune din lemn. Implicit: 8. Interval: de la 1 la 200.
steel-plate2=Activează rețeta furnalului avansat care produce oțel direct din minereu de fier. Activat implicit.
cool=Activează rețeta care transformă lemnul în cărbune. Activat implicit.
load-furn-balance-mode=Alege progresia cercetării furnalelor. Profilul original păstrează cerințele originale. Profilurile extensiilor adaugă pachetele științifice și cerințele prealabile aferente. Dacă lipsesc extensii, se folosește conținutul disponibil; dacă cerințele nu pot fi determinate, se păstrează cercetarea originală. Cercetările finalizate sunt păstrate.
load-furn-steel-yield=Plăci de oțel produse din 5 unități de minereu de fier în 16 secunde. Necesită topirea directă a oțelului. Implicit: 1. Interval: de la 1 la 100. Loturile din versiunile vechi modifică proporțional ingredientele, timpul și producția împreună.
load-furn-extra-smelting=Permite rețetele potrivite de transformare a minereurilor în plăci din modurile instalate în furnalele avansate și adaugă alternative de producție directă a oțelului pentru minereurile potrivite care conțin fier. Păstrează cantitățile de minereu și timpul total de fabricație. Necesită atât tehnologiile sursă, cât și primul furnal avansat. Exclude fluidele, rezultatele aleatorii, produsele secundare, reciclarea și procesele chimice. Dezactivat implicit.

