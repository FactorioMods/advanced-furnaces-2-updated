[mod-setting-description]
load-furn-easy-research=Binabawasan ang gastos sa pananaliksik ng mga teknolohiya ng makabagong pugon. Naka-disable bilang default.
logist=Pinapagana ang mga kasamang antas ng pangkarga at mga PRO conveyor. Naka-enable bilang default.
load-furn-legacy=Nagdaragdag ng mga kopyang mas malaki ang batch ng mga suportadong resipe ng pagtunaw at lumang compatibility sa productivity. Binabago nang magkakasama ayon sa iisang proporsiyon ang dami ng sangkap, output at oras ng paggawa. Naka-disable bilang default.
load-furn-energy=Minumultiply ang konsumo ng enerhiya ng pugon. Default: 1. Saklaw: 0.1 hanggang 5.
load-furn-crafting-speed=Halaga para sa pag-aayos ng bilis ng paggawa ng pugon. Kung walang lumang maramihang pagproseso, ang bilis na hinango sa conveyor belt ay hinahati sa halagang ito. Sa lumang mode, minumultiply rito ang batayang bilis. Default: 1. Saklaw: 0.1 hanggang 5.
load-furn-pollution-speed=Minumultiply ang polusyon ng pugon. Nakaaapekto rin ang sukat ng bilis ng paggawa sa mga emisyon. Default: 1. Saklaw: 0.001 hanggang 10.
loader-pro-use-trains=Naka-disable: walang pagkarga sa bagon. Awtomatiko lamang: kinakargahan o inaalisan ng karga ang mga awtomatikong tren na nakahinto sa istasyon. Lahat ng nakahintong tren: kasama rin ang mga nakahintong manwal na tren. Sinusuportahan ang pagkakaayos ng bagon sa apat na pangunahing direksiyon. Default: naka-disable.
recipe-wood-to-coal=Karbon na nalilikha mula sa 1 kahoy sa loob ng 10 segundo. Kailangan ang resipe ng kahoy tungo sa karbon. Default: 8. Saklaw: 1 hanggang 200.
steel-plate2=Pinapagana ang resipe ng makabagong pugon na gumagawa ng asero nang direkta mula sa mineral na bakal. Naka-enable bilang default.
cool=Pinapagana ang resipeng nagiging karbon ang kahoy. Naka-enable bilang default.
load-furn-balance-mode=Pinipili ang pag-usad ng pananaliksik sa pugon. Pinananatili ng Orihinal ang mga orihinal na kinakailangan. Idinaragdag ng mga profile ng expansion ang kanilang mga science pack at paunang kinakailangan. Kung wala ang mga expansion, ginagamit ang magagamit na nilalaman; kapag hindi matukoy ang mga kinakailangan, pinananatili ang orihinal na pananaliksik. Pinananatili ang natapos na pananaliksik.
load-furn-steel-yield=Mga plakang asero na nalilikha mula sa 5 mineral na bakal sa loob ng 16 segundo. Kailangan ang direktang pagtunaw ng asero. Default: 1. Saklaw: 1 hanggang 100. Binabago ng lumang maramihang pagproseso ang mga sangkap, oras at output nang magkakasama ayon sa iisang proporsiyon.
load-furn-extra-smelting=Pinapahintulutan sa mga makabagong pugon ang angkop na mga resipe mula mineral tungo sa plakang metal mula sa mga naka-install na mod, at nagdaragdag ng mga alternatibong direktang paggawa ng asero mula sa angkop na mga mineral na may bakal. Pinananatili ang dami ng mineral at kabuuang oras ng paggawa. Kailangan kapwa ang mga pinagmulang teknolohiya at ang unang makabagong pugon. Hindi kasama ang mga likido, random na resulta, byproduct, pagre-recycle at mga prosesong kemikal. Naka-disable bilang default.

