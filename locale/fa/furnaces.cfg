[mod-setting-description]
load-furn-easy-research=شهاک ار هتفرشیپ ٔهروک یاهیروانف شهوژپ ٔهنیزه\n.تسا لاعفریغ ضرفشیپ روطهب .دهدیم
logist=لاعف ار هارمه PRO یاههلاقن و راذگراب یاههدر\n.تسا لاعف ضرفشیپ روطهب .دنکیم
load-furn-legacy=هدشینابیتشپ بوذ یاهروتسد رتگرزبهتسد یاههخسن\nرادقم .دنکیم هفاضا ار یمیدق یروهرهب یراگزاس و\nسایقم مه اب تخاس نامز و یجورخ ،هیلوا داوم\n.تسا لاعفریغ ضرفشیپ روطهب .دنوشیم
load-furn-energy=.دنکیم برض بیرض نیا رد ار هروک یژرنا فرصم\n.5 ات 0.1 :هزاب .1 :ضرفشیپ
load-furn-crafting-speed=تعرس ،یمیدق یدنبهتسد نودب .هروک تخاس تعرس سایقم\n.دوشیم میسقت رادقم نیا رب هلاقن راون زا هتفرگرب\n.دوشیم برض نآ رد هیاپ تعرس ،یمیدق تلاح رد\n.5 ات 0.1 :هزاب .1 :ضرفشیپ
load-furn-pollution-speed=سایقم .دنکیم برض بیرض نیا رد ار هروک یگدولآ\n.دراذگیم رثا یگدولآ راشتنا رب زین تخاس تعرس\n.10 ات 0.001 :هزاب .1 :ضرفشیپ
loader-pro-use-trains=:راکدوخ طقف .دنوشیمن یریگراب اهنگاو :لاعفریغ\nای یریگراب ار هاگتسیا رد فقوتم راکدوخ یاهراطق\nیتسد یاهراطق :فقوتم یاهراطق ٔهمه .دنکیم هیلخت\nرد اهنگاو نامدیچ زا .دوشیم لماش زین ار فقوتم\n.لاعفریغ :ضرفشیپ .دنکیم ینابیتشپ یلصا تهج راهچ
recipe-wood-to-coal=روتسد هب .هیناث 10 رد بوچ 1 زا هدشدیلوت گنسلاغز\n.8 :ضرفشیپ .دراد زاین گنسلاغز هب بوچ لیدبت\n.200 ات 1 :هزاب
steel-plate2=زا دالوف میقتسم دیلوت یارب هتفرشیپ ٔهروک روتسد\n.تسا لاعف ضرفشیپ روطهب .دنکیم لاعف ار نهآگنس
cool=.دنکیم لاعف ار گنسلاغز هب بوچ لیدبت روتسد\n.تسا لاعف ضرفشیپ روطهب
load-furn-balance-mode=تلاح .دنکیم باختنا ار هروک شهوژپ تفرشیپ دنور\nیاههیامن .دنکیم ظفح ار یلصا یاهیدنمزاین یلصا\nدوخ یاهزاینشیپ و یملع یاههتسب ،یقاحلا یاههتسب\n،دشابن دوجوم یقاحلا ٔهتسب رگا .دننکیم هفاضا ار\nاهیدنمزاین رگا ؛دوشیم هدافتسا دوجوم یاوتحم\n.دوشیم ظفح یلصا شهوژپ ،دنشابن نییعت لباق\n.دنوشیم ظفح هدشلیمکت یاهشهوژپ
load-furn-steel-yield=16 رد نهآگنس 5 زا هدشدیلوت یدالوف یاهقرو\n:ضرفشیپ .دراد زاین دالوف میقتسم بوذ هب .هیناث\n،هیلوا داوم یمیدق یدنبهتسد .100 ات 1 :هزاب .1\n.دنکیم سایقم مه اب ار یجورخ و نامز
load-furn-extra-smelting=یاهدوم زا قرو هب ندعم گنس لیدبت بسانم یاهروتسد\nو دنکیم زاجم هتفرشیپ یاههروک رد ار هدشبصن\nدیلوت یاهنیزگیاج ،نهآ یواح بسانم یاهگنس یارب\nعومجم و ندعم گنس رادقم .دیازفایم دالوف میقتسم\nمه و أدبم یاهیروانف هب مه .دوشیم ظفح تخاس نامز\nجیاتن ،تالایس .دراد زاین هتفرشیپ ٔهروک نیتسخن هب\nیاهدنیارف و تفایزاب ،یبناج تالوصحم ،یفداصت\nلاعفریغ ضرفشیپ روطهب .دنتسه انثتسم ییایمیش\n.تسا

