[mod-setting-name]
load-furn-extra-smelting=Fundición adicional de minerales

[mod-setting-description]
load-furn-extra-smelting=Opcional: añade categorías existentes respaldadas por recetas deterministas de mineral a placas a los cinco hornos avanzados; excluye reciclaje, química y fabricación genérica. También combina recetas deterministas de un solo mineral que producen hierro con la receta de acero, conservando las cantidades de mineral y el tiempo total. Requiere ambas tecnologías de origen y el primer horno avanzado; la alternativa cuesta una unidad de investigación con las ciencias del primer horno. No cambia las recetas existentes ni añade categorías exclusivas de fundiciones.

[advanced-furnaces]
direct-steel=Acero a partir de __1__
