[mod-setting-description]
load-furn-easy-research=Reduce el coste de investigación de las tecnologías de hornos avanzados. Desactivado por defecto.
logist=Activa los niveles de cargadores y las cintas PRO incluidos. Activado por defecto.
load-furn-legacy=Añade copias de las recetas de fundición compatibles con lotes mayores y la compatibilidad antigua con la productividad. Las cantidades de ingredientes, los productos y el tiempo de fabricación se ajustan conjuntamente. Desactivado por defecto.
load-furn-energy=Multiplica el consumo de energía de los hornos. Valor por defecto: 1. Intervalo: de 0.1 a 5.
load-furn-crafting-speed=Factor aplicado a la velocidad de fabricación de los hornos. Sin los lotes del modo antiguo, la velocidad derivada de la cinta se divide entre este valor. En el modo antiguo, la velocidad base se multiplica por él. Valor por defecto: 1. Intervalo: de 0.1 a 5.
load-furn-pollution-speed=Multiplica la contaminación de los hornos. El factor de velocidad de fabricación también afecta a las emisiones. Valor por defecto: 1. Intervalo: de 0.001 a 10.
loader-pro-use-trains=Desactivado: no se cargan vagones. Solo automáticos: carga o descarga trenes automáticos detenidos en una estación. Todos los trenes detenidos: incluye también los trenes manuales detenidos. Admite disposiciones de vagones orientadas a los puntos cardinales. Valor por defecto: desactivado.
recipe-wood-to-coal=Carbón producido a partir de 1 unidad de madera en 10 segundos. Requiere la receta de carbón a partir de madera. Valor por defecto: 8. Intervalo: de 1 a 200.
steel-plate2=Activa la receta de los hornos avanzados que produce acero directamente a partir de mineral de hierro. Activado por defecto.
cool=Activa la receta que convierte madera en carbón. Activado por defecto.
load-furn-balance-mode=Elige la progresión de la investigación de los hornos. Original conserva los requisitos originales. Los perfiles de expansión añaden sus paquetes de ciencia y requisitos previos. Si faltan expansiones, se utiliza el contenido disponible; si no se pueden resolver los requisitos, se conserva la investigación original. Las investigaciones completadas se mantienen.
load-furn-steel-yield=Barras de acero producidas a partir de 5 minerales de hierro en 16 segundos. Requiere la fundición directa de acero. Valor por defecto: 1. Intervalo: de 1 a 100. Los lotes del modo antiguo ajustan conjuntamente los ingredientes, el tiempo y los productos.
load-furn-extra-smelting=Permite en los hornos avanzados las recetas apropiadas de mineral a plancha de los mods instalados y añade alternativas de acero directo para minerales ferríferos adecuados. Conserva las cantidades de mineral y el tiempo total de fabricación. Requiere tanto las tecnologías de origen como el primer horno avanzado. Excluye fluidos, resultados aleatorios, subproductos, reciclaje y procesos químicos. Desactivado por defecto.

