[mod-setting-description]
load-furn-easy-research=Verlaagt de onderzoekskosten van de geavanceerde oventechnologieën. Standaard uitgeschakeld.
logist=Schakelt de meegeleverde laderniveaus en PRO-transportbanden in. Standaard ingeschakeld.
load-furn-legacy=Voegt kopieën van ondersteunde smeltrecepten met grotere batches en de oude productiviteitscompatibiliteit toe. Hoeveelheden ingrediënten, opbrengst en productietijd worden samen geschaald. Standaard uitgeschakeld.
load-furn-energy=Vermenigvuldigt het energieverbruik van ovens. Standaard: 1. Bereik: 0.1 tot 5.
load-furn-crafting-speed=Factor voor de productiesnelheid van ovens. Zonder oude batches wordt de van de transportband afgeleide snelheid door deze waarde gedeeld. In de oude modus wordt de basissnelheid hiermee vermenigvuldigd. Standaard: 1. Bereik: 0.1 tot 5.
load-furn-pollution-speed=Vermenigvuldigt de vervuiling van ovens. De productiesnelheidsfactor beïnvloedt ook de uitstoot. Standaard: 1. Bereik: 0.001 tot 10.
loader-pro-use-trains=Uitgeschakeld: geen wagons laden. Alleen automatisch: laadt of lost automatische treinen die bij een station stilstaan. Alle stilstaande treinen: omvat ook stilstaande handmatige treinen. Ondersteunt wagonopstellingen in de vier windrichtingen. Standaard: uitgeschakeld.
recipe-wood-to-coal=Steenkool die uit 1 hout in 10 seconden wordt geproduceerd. Vereist het recept voor steenkool uit hout. Standaard: 8. Bereik: 1 tot 200.
steel-plate2=Schakelt het recept voor geavanceerde ovens in dat staal rechtstreeks uit ijzererts maakt. Standaard ingeschakeld.
cool=Schakelt het recept in dat hout omzet in steenkool. Standaard ingeschakeld.
load-furn-balance-mode=Kiest het onderzoeksverloop voor ovens. Origineel behoudt de oorspronkelijke vereisten. Uitbreidingsprofielen voegen hun wetenschapspakketten en vereisten toe. Bij ontbrekende uitbreidingen wordt beschikbare inhoud gebruikt; bij onopgeloste vereisten blijft het oorspronkelijke onderzoek behouden. Voltooid onderzoek blijft behouden.
load-furn-steel-yield=Stalen platen die uit 5 ijzererts in 16 seconden worden geproduceerd. Vereist rechtstreeks staal smelten. Standaard: 1. Bereik: 1 tot 100. Oude batches schalen ingrediënten, tijd en opbrengst samen.
load-furn-extra-smelting=Staat geschikte recepten van erts naar plaat uit geïnstalleerde mods toe in geavanceerde ovens en voegt alternatieven voor rechtstreeks staal toe voor geschikte ijzerhoudende ertsen. Behoudt de ertshoeveelheden en de totale productietijd. Vereist zowel de oorspronkelijke technologieën als de eerste geavanceerde oven. Sluit vloeistoffen, willekeurige resultaten, bijproducten, recycling en chemische processen uit. Standaard uitgeschakeld.

