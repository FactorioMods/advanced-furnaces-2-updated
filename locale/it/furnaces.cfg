[mod-setting-description]
load-furn-easy-research=Riduce il costo di ricerca delle tecnologie delle fornaci avanzate. Disabilitato per impostazione predefinita.
logist=Abilita i livelli di caricatori e i rulli PRO inclusi. Abilitato per impostazione predefinita.
load-furn-legacy=Aggiunge copie delle ricette di fusione supportate con lotti più grandi e la compatibilità precedente con la produttività. Le quantità degli ingredienti, i prodotti e il tempo di produzione vengono scalati insieme. Disabilitato per impostazione predefinita.
load-furn-energy=Moltiplica il consumo energetico delle fornaci. Valore predefinito: 1. Intervallo: da 0.1 a 5.
load-furn-crafting-speed=Fattore usato per la velocità di produzione delle fornaci. Senza i lotti della modalità precedente, la velocità derivata dal rullo viene divisa per questo valore. Nella modalità precedente, la velocità di base viene moltiplicata per questo valore. Valore predefinito: 1. Intervallo: da 0.1 a 5.
load-furn-pollution-speed=Moltiplica l'inquinamento delle fornaci. Il fattore della velocità di produzione influisce anche sulle emissioni. Valore predefinito: 1. Intervallo: da 0.001 a 10.
loader-pro-use-trains=Disabilitato: nessun carico dei vagoni. Solo automatici: carica o scarica i treni automatici fermi in una stazione. Tutti i treni fermi: include anche i treni manuali fermi. Supporta disposizioni dei vagoni lungo i punti cardinali. Valore predefinito: disabilitato.
recipe-wood-to-coal=Carbone prodotto da 1 unità di legno in 10 secondi. Richiede la ricetta da legno a carbone. Valore predefinito: 8. Intervallo: da 1 a 200.
steel-plate2=Abilita la ricetta delle fornaci avanzate che produce acciaio direttamente dal minerale di ferro. Abilitato per impostazione predefinita.
cool=Abilita la ricetta che trasforma il legno in carbone. Abilitato per impostazione predefinita.
load-furn-balance-mode=Sceglie la progressione della ricerca sulle fornaci. Originale mantiene i requisiti originali. I profili delle espansioni aggiungono i propri pacchetti scientifici e prerequisiti. Se mancano espansioni, viene usato il contenuto disponibile; se non è possibile risolvere i requisiti, viene mantenuta la ricerca originale. Le ricerche completate vengono conservate.
load-furn-steel-yield=Piastre d'acciaio prodotte da 5 minerali di ferro in 16 secondi. Richiede la fusione diretta dell'acciaio. Valore predefinito: 1. Intervallo: da 1 a 100. I lotti della modalità precedente scalano insieme ingredienti, tempo e prodotti.
load-furn-extra-smelting=Consente nelle fornaci avanzate le ricette adatte da minerale a piastra delle mod installate e aggiunge alternative per produrre direttamente acciaio dai minerali ferrosi adatti. Mantiene le quantità di minerale e il tempo totale di produzione. Richiede sia le tecnologie di origine sia la prima fornace avanzata. Esclude fluidi, risultati casuali, sottoprodotti, riciclaggio e processi chimici. Disabilitato per impostazione predefinita.

