[mod-setting-description]
load-furn-easy-research=Reduktas la esplorkoston de la altnivelaj fornoteknologioj. Defaŭlte malŝaltita.
logist=Ebligas la inkluzivitajn ŝargilnivelojn kaj PRO-transportbendojn. Defaŭlte ŝaltita.
load-furn-legacy=Aldonas kopiojn de subtenataj fandreceptoj por pli grandaj aroj kaj heredan kongruecon kun produktiveco. La kvantoj de ingrediencoj, produktoj kaj fabriktempo skaliĝas kune. Defaŭlte malŝaltita.
load-furn-energy=Multiplikas la energikonsumon de fornoj. Defaŭlto: 1. Intervalo: 0.1 ĝis 5.
load-furn-crafting-speed=Skalo por la fabrikrapido de fornoj. Sen heredaj grandkvantaj receptoj, la rapido derivita de transportbendoj estas dividata per ĉi tiu valoro. En hereda reĝimo, la baza rapido estas multiplikata per ĝi. Defaŭlto: 1. Intervalo: 0.1 ĝis 5.
load-furn-pollution-speed=Multiplikas la poluadon de fornoj. La skalo de fabrikrapido ankaŭ influas la emisiojn. Defaŭlto: 1. Intervalo: 0.001 ĝis 10.
loader-pro-use-trains=Malŝaltita: neniu vagonŝargado. Nur aŭtomataj: ŝargas aŭ malŝargas aŭtomatajn trajnojn haltintajn ĉe stacio. Ĉiuj haltintaj trajnoj: inkluzivas ankaŭ haltintajn permane stiratajn trajnojn. Subtenas vagonojn orientitajn laŭ la ĉefaj kompasdirektoj. Defaŭlte malŝaltita.
recipe-wood-to-coal=Karbo produktata el 1 ligno en 10 sekundoj. Postulas la recepton de ligno al karbo. Defaŭlto: 8. Intervalo: 1 ĝis 200.
steel-plate2=Ebligas la altnivelan fornorecepton, kiu produktas ŝtalon rekte el fererco. Defaŭlte ŝaltita.
cool=Ebligas la recepton, kiu transformas lignon en karbon. Defaŭlte ŝaltita.
load-furn-balance-mode=Elektas la esplorprogresadon de fornoj. Originala konservas la originajn postulojn. Ekspansiaj profiloj aldonas siajn sciencpakaĵojn kaj antaŭkondiĉojn. Mankantaj ekspansioj uzas la disponeblan enhavon; nesolvitaj postuloj konservas la originan esploron. Finita esploro estas konservata.
load-furn-steel-yield=Ŝtalaj platoj produktataj el 5 ferercoj en 16 sekundoj. Postulas rektan ŝtalfandadon. Defaŭlto: 1. Intervalo: 1 ĝis 100. Heredaj grandkvantaj receptoj skalas ingrediencojn, tempon kaj produktojn kune.
load-furn-extra-smelting=Permesas taŭgajn receptojn de erco al plato el instalitaj modifoj en la altnivelaj fornoj kaj aldonas rektajn ŝtalalternativojn por taŭgaj ferhavaj ercoj. Konservas erckvantojn kaj la tutan fabriktempon. Postulas kaj la fontajn teknologiojn kaj la unuan altnivelan fornon. Ekskludas fluidojn, hazardajn rezultojn, kromproduktojn, recikladon kaj kemiajn procezojn. Defaŭlte malŝaltita.

