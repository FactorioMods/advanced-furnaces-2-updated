[mod-setting-description]
load-furn-easy-research=Ul koston e kërkimit të teknologjive të furrave të përparuara. Si parazgjedhje është çaktivizuar.
logist=Aktivizon nivelet e përfshira të ngarkuesve dhe transportuesit PRO. Si parazgjedhje është aktivizuar.
load-furn-legacy=Shton kopje të recetave të mbështetura të shkrirjes me sasi më të mëdha dhe përputhshmëri të vjetër me prodhimtarinë. Sasitë e përbërësve, produktet dhe koha e prodhimit shkallëzohen së bashku. Si parazgjedhje është çaktivizuar.
load-furn-energy=Shumëzon konsumin e energjisë së furrave. Parazgjedhja: 1. Intervali: 0.1 deri në 5.
load-furn-crafting-speed=Shkallëzimi i shpejtësisë së prodhimit të furrave. Pa recetat e vjetra me sasi të mëdha, shpejtësia e nxjerrë nga rripi pjesëtohet me këtë vlerë. Në mënyrën e vjetër, shpejtësia bazë shumëzohet me të. Parazgjedhja: 1. Intervali: 0.1 deri në 5.
load-furn-pollution-speed=Shumëzon ndotjen e furrave. Shkallëzimi i shpejtësisë së prodhimit ndikon edhe në shkarkime. Parazgjedhja: 1. Intervali: 0.001 deri në 10.
loader-pro-use-trains=Çaktivizuar: pa ngarkim vagonësh. Vetëm automatikë: ngarkon ose shkarkon trenat automatikë të ndalur në stacion. Të gjithë trenat e ndalur: përfshin edhe trenat manualë të ndalur. Mbështet vagonë të orientuar sipas drejtimeve kryesore të horizontit. Parazgjedhja: çaktivizuar.
recipe-wood-to-coal=Qymyr i prodhuar nga 1 njësi druri në 10 sekonda. Kërkon recetën për kthimin e drurit në qymyr. Parazgjedhja: 8. Intervali: 1 deri në 200.
steel-plate2=Aktivizon recetën e furrës së përparuar që prodhon çelik drejtpërdrejt nga mineral hekuri. Si parazgjedhje është aktivizuar.
cool=Aktivizon recetën që kthen drurin në qymyr. Si parazgjedhje është aktivizuar.
load-furn-balance-mode=Zgjedh ecurinë e kërkimit të furrave. Origjinal ruan kërkesat fillestare. Profilet e zgjerimeve shtojnë paketat e tyre shkencore dhe parakushtet. Për zgjerimet që mungojnë përdoret përmbajtja e disponueshme; kërkesat e pazgjidhura ruajnë kërkimin fillestar. Kërkimi i përfunduar ruhet.
load-furn-steel-yield=Pllaka çeliku të prodhuara nga 5 njësi minerali hekuri në 16 sekonda. Kërkon shkrirjen e drejtpërdrejtë të çelikut. Parazgjedhja: 1. Intervali: 1 deri në 100. Recetat e vjetra me sasi të mëdha shkallëzojnë përbërësit, kohën dhe produktet së bashku.
load-furn-extra-smelting=Lejon në furrat e përparuara recetat e përshtatshme nga modifikimet e instaluara që prodhojnë pllaka nga mineralet dhe shton alternativa të drejtpërdrejta të çelikut për minerale të përshtatshme që përmbajnë hekur. Ruan sasitë e mineraleve dhe kohën e përgjithshme të prodhimit. Kërkon si teknologjitë burimore, ashtu edhe furrën e parë të përparuar. Përjashton lëngjet, rezultatet e rastësishme, nënproduktet, riciklimin dhe proceset kimike. Si parazgjedhje është çaktivizuar.

