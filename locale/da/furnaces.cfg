[mod-setting-description]
load-furn-easy-research=Reducerer forskningsomkostningerne for de avancerede ovnteknologier. Deaktiveret som standard.
logist=Aktiverer de medfølgende lasterniveauer og PRO-transportbånd. Aktiveret som standard.
load-furn-legacy=Tilføjer udgaver med større portioner af understøttede smelteopskrifter samt ældre produktivitetskompatibilitet. Ingrediensmængder, udbytte og fremstillingstid skaleres sammen. Deaktiveret som standard.
load-furn-energy=Multiplicerer ovnenes energiforbrug. Standard: 1. Interval: 0.1 til 5.
load-furn-crafting-speed=Skalering af ovnenes fremstillingshastighed. Uden ældre batchopskrifter divideres den båndbaserede hastighed med denne værdi. I ældre tilstand multipliceres grundhastigheden med den. Standard: 1. Interval: 0.1 til 5.
load-furn-pollution-speed=Multiplicerer ovnenes forurening. Skaleringen af fremstillingshastigheden påvirker også udledningen. Standard: 1. Interval: 0.001 til 10.
loader-pro-use-trains=Deaktiveret: ingen vognlastning. Kun automatisk: laster eller tømmer automatiske tog, der holder ved en station. Alle standsede tog: omfatter også standsede manuelle tog. Understøtter vogne orienteret efter verdenshjørnerne. Standard: deaktiveret.
recipe-wood-to-coal=Kul fremstillet af 1 træ på 10 sekunder. Kræver opskriften fra træ til kul. Standard: 8. Interval: 1 til 200.
steel-plate2=Aktiverer den avancerede ovnopskrift, der fremstiller stål direkte af jernmalm. Aktiveret som standard.
cool=Aktiverer opskriften, der omdanner træ til kul. Aktiveret som standard.
load-furn-balance-mode=Vælger ovnenes forskningsforløb. Original bevarer de oprindelige krav. Udvidelsesprofiler tilføjer deres forskningspakker og forudsætninger. Manglende udvidelser erstattes af tilgængeligt indhold; uafklarede krav bevarer den oprindelige forskning. Afsluttet forskning bevares.
load-furn-steel-yield=Stålplader fremstillet af 5 jernmalm på 16 sekunder. Kræver direkte stålsmeltning. Standard: 1. Interval: 1 til 100. Ældre batchopskrifter skalerer ingredienser, tid og udbytte sammen.
load-furn-extra-smelting=Tillader egnede opskrifter fra malm til plader fra installerede mods i de avancerede ovne og tilføjer direkte stålalternativer for egnede jernholdige malmtyper. Bevarer malmmængder og samlet fremstillingstid. Kræver både kildeteknologierne og den første avancerede ovn. Udelukker væsker, tilfældige resultater, biprodukter, genanvendelse og kemiske processer. Deaktiveret som standard.

