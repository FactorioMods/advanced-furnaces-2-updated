[mod-setting-description]
load-furn-easy-research=Giảm chi phí nghiên cứu công nghệ lò luyện tiên tiến. Mặc định tắt.
logist=Bật các cấp máy nạp và băng chuyền PRO đi kèm. Mặc định bật.
load-furn-legacy=Thêm bản sao theo mẻ lớn hơn của các công thức luyện được hỗ trợ và khả năng tương thích năng suất kiểu cũ. Lượng nguyên liệu, sản lượng và thời gian chế tạo cùng thay đổi theo một tỷ lệ. Mặc định tắt.
load-furn-energy=Nhân mức tiêu thụ năng lượng của lò với hệ số này. Mặc định: 1. Phạm vi: 0.1 đến 5.
load-furn-crafting-speed=Hệ số điều chỉnh tốc độ chế tạo của lò. Khi không dùng chế độ theo mẻ kiểu cũ, tốc độ tính từ băng chuyền được chia cho giá trị này. Trong chế độ cũ, tốc độ cơ bản được nhân với giá trị này. Mặc định: 1. Phạm vi: 0.1 đến 5.
load-furn-pollution-speed=Nhân lượng ô nhiễm của lò với hệ số này. Hệ số điều chỉnh tốc độ chế tạo cũng ảnh hưởng đến lượng phát thải. Mặc định: 1. Phạm vi: 0.001 đến 10.
loader-pro-use-trains=Tắt: không xếp hàng lên toa. Chỉ tự động: xếp hoặc dỡ hàng cho tàu tự động đang dừng tại ga. Tất cả tàu đang dừng: bao gồm cả tàu điều khiển thủ công đang dừng. Hỗ trợ bố trí toa theo bốn hướng chính. Mặc định: tắt.
recipe-wood-to-coal=Than đá được tạo ra từ 1 gỗ trong 10 giây. Cần công thức chuyển gỗ thành than đá. Mặc định: 8. Phạm vi: 1 đến 200.
steel-plate2=Bật công thức lò luyện tiên tiến tạo thép trực tiếp từ quặng sắt. Mặc định bật.
cool=Bật công thức chuyển gỗ thành than đá. Mặc định bật.
load-furn-balance-mode=Chọn tiến trình nghiên cứu lò luyện. Nguyên bản giữ các yêu cầu gốc. Hồ sơ bản mở rộng thêm các gói khoa học và điều kiện tiên quyết tương ứng. Nếu thiếu bản mở rộng, dùng nội dung có sẵn; nếu không xác định được yêu cầu, giữ nghiên cứu gốc. Nghiên cứu đã hoàn tất được giữ lại.
load-furn-steel-yield=Tấm thép được tạo ra từ 5 quặng sắt trong 16 giây. Cần luyện thép trực tiếp. Mặc định: 1. Phạm vi: 1 đến 100. Chế độ theo mẻ kiểu cũ điều chỉnh nguyên liệu, thời gian và sản lượng cùng tỷ lệ.
load-furn-extra-smelting=Cho phép dùng các công thức quặng thành tấm kim loại phù hợp từ mod đã cài trong lò luyện tiên tiến và thêm phương án luyện thép trực tiếp từ các quặng chứa sắt phù hợp. Giữ nguyên lượng quặng và tổng thời gian chế tạo. Cần cả công nghệ nguồn lẫn lò luyện tiên tiến đầu tiên. Loại trừ chất lưu, kết quả ngẫu nhiên, sản phẩm phụ, tái chế và quy trình hóa học. Mặc định tắt.

