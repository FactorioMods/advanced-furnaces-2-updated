[mod-setting-description]
load-furn-easy-research=Zmniejsza koszt badań technologii zaawansowanych pieców. Domyślnie wyłączone.
logist=Włącza dołączone poziomy ładowarek i taśmociągi PRO. Domyślnie włączone.
load-furn-legacy=Dodaje kopie obsługiwanych receptur wytapiania dla większych partii oraz zgodność z produktywnością ze starszych wersji. Ilości składników, uzysk i czas wytwarzania zmieniają się proporcjonalnie. Domyślnie wyłączone.
load-furn-energy=Mnoży zużycie energii przez piece. Domyślnie: 1. Zakres: od 0.1 do 5.
load-furn-crafting-speed=Współczynnik prędkości wytwarzania pieców. Bez dużych partii ze starszych wersji prędkość wyznaczona na podstawie taśmociągu jest dzielona przez tę wartość. W trybie starszych wersji prędkość bazowa jest przez nią mnożona. Domyślnie: 1. Zakres: od 0.1 do 5.
load-furn-pollution-speed=Mnoży zanieczyszczenie wytwarzane przez piece. Współczynnik prędkości wytwarzania również wpływa na emisje. Domyślnie: 1. Zakres: od 0.001 do 10.
loader-pro-use-trains=Wyłączone: brak załadunku wagonów. Tylko automatyczne: ładuje lub rozładowuje pociągi w trybie automatycznym zatrzymane na stacji. Wszystkie zatrzymane pociągi: obejmuje również zatrzymane pociągi w trybie ręcznym. Obsługuje wagony ustawione w głównych kierunkach świata. Domyślnie: wyłączone.
recipe-wood-to-coal=Ilość węgla wytwarzana z 1 jednostki drewna w 10 sekund. Wymaga receptury węgla z drewna. Domyślnie: 8. Zakres: od 1 do 200.
steel-plate2=Włącza recepturę zaawansowanego pieca wytwarzającą stal bezpośrednio z rudy żelaza. Domyślnie włączone.
cool=Włącza recepturę przetwarzania drewna na węgiel. Domyślnie włączone.
load-furn-balance-mode=Wybiera przebieg badań pieców. Profil oryginalny zachowuje pierwotne wymagania. Profile dodatków dodają odpowiednie pakiety naukowe i wymagania wstępne. Przy braku dodatków używana jest dostępna zawartość; jeśli wymagań nie można ustalić, zachowane zostaje oryginalne badanie. Ukończone badania zostają zachowane.
load-furn-steel-yield=Stalowe płytki wytwarzane z 5 jednostek rudy żelaza w 16 sekund. Wymaga bezpośredniego wytapiania stali. Domyślnie: 1. Zakres: od 1 do 100. Duże partie ze starszych wersji proporcjonalnie zmieniają ilości składników, czas i uzysk.
load-furn-extra-smelting=Pozwala używać w zaawansowanych piecach odpowiednich receptur wytapiania płytek z rud z zainstalowanych modów i dodaje warianty bezpośredniego wytapiania stali z odpowiednich rud zawierających żelazo. Zachowuje ilości rud i całkowity czas wytwarzania. Wymaga zarówno technologii źródłowych, jak i pierwszego zaawansowanego pieca. Wyklucza płyny, losowe wyniki, produkty uboczne, recykling i procesy chemiczne. Domyślnie wyłączone.

