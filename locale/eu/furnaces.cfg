[mod-setting-description]
load-furn-easy-research=Labe aurreratuen teknologien ikerketa-kostua murrizten du. Lehenespenez desgaituta.
logist=Barne hartutako kargatzaile-mailak eta PRO uhal garraiatzaileak gaitzen ditu. Lehenespenez gaituta.
load-furn-legacy=Onartutako galdaketa-errezeten kopiak gehitzen ditu sorta handiagoekin, baita produktibitatearekiko bateragarritasun zaharra ere. Osagai-kantitateak, ekoizpena eta ekoizpen-denbora batera eskalatzen dira. Lehenespenez desgaituta.
load-furn-energy=Labeen energia-kontsumoa biderkatzen du. Lehenetsia: 1. Barrutia: 0.1 eta 5 artean.
load-furn-crafting-speed=Labeen ekoizpen-abiadurarako erabiltzen den eskala. Modu zaharreko sortarik gabe, uhaletik eratorritako abiadura balio honetaz zatitzen da. Modu zaharrean, oinarrizko abiadura balio honetaz biderkatzen da. Lehenetsia: 1. Barrutia: 0.1 eta 5 artean.
load-furn-pollution-speed=Labeen kutsadura biderkatzen du. Ekoizpen-abiaduraren eskalak ere emisioei eragiten die. Lehenetsia: 1. Barrutia: 0.001 eta 10 artean.
loader-pro-use-trains=Desgaituta: ez da bagoirik kargatzen. Automatikoak soilik: geltoki batean geldirik dauden tren automatikoak kargatzen edo deskargatzen ditu. Geldirik dauden tren guztiak: eskuzko tren geldiak ere barne hartzen ditu. Bagoien puntu kardinalen araberako antolamenduak onartzen ditu. Lehenetsia: desgaituta.
recipe-wood-to-coal=1 zur-unitatetik 10 segundoan ekoitzitako ikatza. Zurretik ikatza egiteko errezeta behar du. Lehenetsia: 8. Barrutia: 1 eta 200 artean.
steel-plate2=Labe aurreratuetan altzairua zuzenean burdin mineraletik egiteko errezeta gaitzen du. Lehenespenez gaituta.
cool=Zurra ikatz bihurtzeko errezeta gaitzen du. Lehenespenez gaituta.
load-furn-balance-mode=Labeen ikerketaren progresioa hautatzen du. Jatorrizkoa aukerak jatorrizko eskakizunak mantentzen ditu. Hedapen-profilek beren zientzia-paketeak eta aurrebaldintzak gehitzen dituzte. Hedapenak falta badira, erabilgarri dagoen edukia erabiltzen da; eskakizunak ezin badira ebatzi, jatorrizko ikerketa mantentzen da. Osatutako ikerketak mantentzen dira.
load-furn-steel-yield=5 burdin mineraletik 16 segundoan ekoitzitako altzairu-xaflak. Altzairuaren zuzeneko galdaketa behar du. Lehenetsia: 1. Barrutia: 1 eta 100 artean. Modu zaharreko sortek osagaiak, denbora eta ekoizpena batera eskalatzen dituzte.
load-furn-extra-smelting=Instalatutako moden mineraletik xaflara bihurtzeko errezeta egokiak labe aurreratuetan erabiltzea ahalbidetzen du, eta altzairua zuzenean egiteko aukerak gehitzen ditu burdina duten mineral egokietarako. Mineral-kantitateak eta ekoizpen-denbora osoa mantentzen ditu. Jatorrizko teknologiak eta lehen labe aurreratua behar ditu. Fluidoak, ausazko emaitzak, azpiproduktuak, birziklapena eta prozesu kimikoak baztertzen ditu. Lehenespenez desgaituta.

