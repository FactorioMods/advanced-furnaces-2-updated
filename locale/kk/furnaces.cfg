[mod-setting-description]
load-furn-easy-research=Жетілдірілген пеш технологияларын зерттеу құнын азайтады. Әдепкіде өшірулі.
logist=Жинақтағы тиегіш деңгейлері мен PRO конвейерлерін қосады. Әдепкіде қосулы.
load-furn-legacy=Қолдау көрсетілетін балқыту рецептілерінің ірі топтамалы көшірмелерін және өнімділікпен ескі үйлесімділікті қосады. Ингредиент мөлшері, өнім және жасау уақыты бірге масштабталады. Әдепкіде өшірулі.
load-furn-energy=Пештің энергия тұтынуын көбейтеді. Әдепкі мән: 1. Ауқым: 0.1-ден 5-ке дейін.
load-furn-crafting-speed=Пештің жасау жылдамдығына арналған масштаб. Ескі топтамалау өшірулі болса, таспадан алынған жылдамдық осы мәнге бөлінеді. Ескі режимде негізгі жылдамдық осы мәнге көбейтіледі. Әдепкі мән: 1. Ауқым: 0.1-ден 5-ке дейін.
load-furn-pollution-speed=Пештің ластануын көбейтеді. Жасау жылдамдығының масштабы да шығарындыларға әсер етеді. Әдепкі мән: 1. Ауқым: 0.001-ден 10-ға дейін.
loader-pro-use-trains=Өшірулі: вагондар тиелмейді. Тек автоматты: станцияда тоқтаған автоматты пойыздарды тиейді немесе түсіреді. Барлық тоқтаған пойыздар: тоқтаған қолмен басқарылатын пойыздарды да қамтиды. Вагондардың төрт негізгі бағытта орналасуын қолдайды. Әдепкі мән: өшірулі.
recipe-wood-to-coal=1 ағаштан 10 секундта өндірілетін көмір. Ағашты көмірге айналдыру рецепті қажет. Әдепкі мән: 8. Ауқым: 1-ден 200-ге дейін.
steel-plate2=Темір кенінен тікелей болат жасайтын жетілдірілген пеш рецептісін қосады. Әдепкіде қосулы.
cool=Ағашты көмірге айналдыратын рецептіні қосады. Әдепкіде қосулы.
load-furn-balance-mode=Пеш зерттеуінің даму жолын таңдайды. Бастапқы режим бастапқы талаптарды сақтайды. Кеңейтім профильдері өз ғылыми пакеттері мен алғышарттарын қосады. Кеңейтімдер жоқ болса, қолжетімді мазмұн қолданылады; талаптар анықталмаса, бастапқы зерттеу сақталады. Аяқталған зерттеулер сақталады.
load-furn-steel-yield=5 темір кенінен 16 секундта өндірілетін болат табақтар. Тікелей болат балқыту қажет. Әдепкі мән: 1. Ауқым: 1-ден 100-ге дейін. Ескі топтамалау ингредиенттерді, уақытты және өнімді бірге масштабтайды.
load-furn-extra-smelting=Орнатылған модтардағы кеннен табақ алудың жарамды рецептілерін жетілдірілген пештерде қолдануға мүмкіндік береді және құрамында темірі бар жарамды кендерден тікелей болат алу баламаларын қосады. Кен мөлшерін және жалпы жасау уақытын сақтайды. Бастапқы технологиялар да, бірінші жетілдірілген пеш те қажет. Сұйықтықтар, кездейсоқ нәтижелер, жанама өнімдер, қайта өңдеу және химиялық үдерістер кірмейді. Әдепкіде өшірулі.

