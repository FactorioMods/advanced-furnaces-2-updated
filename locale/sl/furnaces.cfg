[mod-setting-description]
load-furn-easy-research=Zmanjša stroške raziskovanja tehnologij naprednih peči. Privzeto onemogočeno.
logist=Omogoči priložene stopnje nakladalnikov in trakove PRO. Privzeto omogočeno.
load-furn-legacy=Doda kopije podprtih receptov za taljenje z večjimi serijami in združljivost s produktivnostjo iz starejših različic. Količine sestavin, izhodna količina in čas izdelave se skupaj spreminjajo v enakem razmerju. Privzeto onemogočeno.
load-furn-energy=Pomnoži porabo energije peči. Privzeto: 1. Razpon: od 0.1 do 5.
load-furn-crafting-speed=Faktor hitrosti izdelave v pečeh. Brez večjih serij iz starejših različic se hitrost, izpeljana iz traku, deli s to vrednostjo. V starem načinu se osnovna hitrost pomnoži z njo. Privzeto: 1. Razpon: od 0.1 do 5.
load-furn-pollution-speed=Pomnoži onesnaževanje peči. Na izpuste vpliva tudi faktor hitrosti izdelave. Privzeto: 1. Razpon: od 0.001 do 10.
loader-pro-use-trains=Onemogočeno: brez nakladanja vagonov. Samo samodejni: naklada ali razklada vlake v samodejnem načinu, ustavljene na postaji. Vsi ustavljeni vlaki: vključuje tudi ustavljene vlake v ročnem načinu. Podpira vagone, usmerjene po glavnih straneh neba. Privzeto: onemogočeno.
recipe-wood-to-coal=Premog, proizveden iz 1 enote lesa v 10 sekundah. Zahteva recept za premog iz lesa. Privzeto: 8. Razpon: od 1 do 200.
steel-plate2=Omogoči recept napredne peči, ki proizvaja jeklo neposredno iz železove rude. Privzeto omogočeno.
cool=Omogoči recept, ki pretvarja les v premog. Privzeto omogočeno.
load-furn-balance-mode=Izbere potek raziskav peči. Izvirni profil ohrani izvirne zahteve. Profili razširitev dodajo svoje znanstvene pakete in predpogoje. Če razširitve manjkajo, se uporabi razpoložljiva vsebina; če zahtev ni mogoče določiti, se ohrani izvirna raziskava. Končane raziskave se ohranijo.
load-furn-steel-yield=Jeklene plošče, proizvedene iz 5 enot železove rude v 16 sekundah. Zahteva neposredno taljenje jekla. Privzeto: 1. Razpon: od 1 do 100. Večje serije iz starejših različic skupaj spreminjajo sestavine, čas in izhodno količino v enakem razmerju.
load-furn-extra-smelting=V naprednih pečeh omogoči ustrezne recepte za taljenje rude v plošče iz nameščenih modov in doda možnosti neposredne proizvodnje jekla za ustrezne rude, ki vsebujejo železo. Ohrani količine rude in skupni čas izdelave. Zahteva tako izvorne tehnologije kot prvo napredno peč. Izključuje tekočine, naključne rezultate, stranske proizvode, recikliranje in kemične procese. Privzeto onemogočeno.

