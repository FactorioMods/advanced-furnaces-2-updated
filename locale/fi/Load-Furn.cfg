[mod-setting-description]
logist=Poista käytöstä modin lataajat ja kuljetinhihnat
load-furn-easy-research=Valitse tämä, jos haluat vähentää teknologian kustannuksia. Oletuksena pois päältä.
load-furn-legacy=Lisää uunireseptit * 10, lisää uunien valmistusnopeutta, avaa tuottavuusmoduulit resepteille ja majakkaefektit.
load-furn-energy=Kertoo energiankulutuksen asetetulla arvolla, 0.1-5.0, oletus 1.0
load-furn-crafting-speed=Säätää valmistusnopeutta. Kerrotaan asetetulla luvulla. Oletus 1.0, minimi 0.1, maksimi 5.0
load-furn-pollution-speed=Säätää saastumisnopeutta. Kerrotaan valmistusnopeudella ja asetetulla luvulla. Oletus 1.0, minimi 0.001, maksimi 10.0
loader-pro-use-trains=Käyttää paljon prosessointitehoa, koska esineet täytyy sijoittaa skriptillä\n\nkaikki junat:\nKaikki tavaravaunut toimivat lataajien kanssa\n\nvain automaattinen:\nVain automaattitilassa olevat junat käytetään\n\npois käytöstä: (oletus)\nLataajat ohittavat junat
steel-plate2=Ota käyttöön erikoisresepti, joka tuottaa enemmän rautalevyjä
cool=Ota käyttöön erikoisresepti, joka tuottaa hiiltä puusta
recipe-wood-to-coal=Muuta kuinka paljon 1 puu voi muuttua hiileksi, oletus on 8, minimi 1 maksimi 200