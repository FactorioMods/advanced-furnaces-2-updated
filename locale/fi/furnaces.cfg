[mod-setting-description]
load-furn-easy-research=Pienentää edistyneiden sulatusuuniteknologioiden tutkimuskustannuksia. Oletuksena pois käytöstä.
logist=Ottaa käyttöön mukana tulevat lastaajatasot ja PRO-kuljettimet. Oletuksena käytössä.
load-furn-legacy=Lisää tuetuista sulatusresepteistä suurempia eriä valmistavat kopiot sekä vanhan tuottavuusyhteensopivuuden. Ainesmäärät, tuotokset ja valmistusajat skaalautuvat yhdessä. Oletuksena pois käytöstä.
load-furn-energy=Kertoo sulatusuunien energiankulutuksen. Oletus: 1. Vaihteluväli: 0.1–5.
load-furn-crafting-speed=Sulatusuunien valmistusnopeuden skaalaus. Kun vanhat eräreseptit eivät ole käytössä, hihnasta johdettu nopeus jaetaan tällä arvolla. Vanhassa tilassa perusnopeus kerrotaan sillä. Oletus: 1. Vaihteluväli: 0.1–5.
load-furn-pollution-speed=Kertoo sulatusuunien saastetuotannon. Myös valmistusnopeuden skaalaus vaikuttaa päästöihin. Oletus: 1. Vaihteluväli: 0.001–10.
loader-pro-use-trains=Pois käytöstä: ei vaunujen lastausta. Vain automaattiset: lastaa tai purkaa asemalla seisovia automaattisia junia. Kaikki pysähtyneet junat: sisältää myös pysähtyneet käsiohjatut junat. Tukee pääilmansuuntien suuntaisia vaunuja. Oletus: pois käytöstä.
recipe-wood-to-coal=Kivihiilen määrä, joka valmistetaan 1 puusta 10 sekunnissa. Vaatii reseptin, joka muuntaa puun kivihiileksi. Oletus: 8. Vaihteluväli: 1–200.
steel-plate2=Ottaa käyttöön edistyneen sulatusuunin reseptin, joka valmistaa terästä suoraan rautamalmista. Oletuksena käytössä.
cool=Ottaa käyttöön reseptin, joka muuntaa puun kivihiileksi. Oletuksena käytössä.
load-furn-balance-mode=Valitsee sulatusuunien tutkimuksen etenemisen. Alkuperäinen säilyttää alkuperäiset vaatimukset. Laajennusprofiilit lisäävät omat tiedepakettinsa ja edellytyksensä. Puuttuvien laajennusten sijaan käytetään saatavilla olevaa sisältöä; ratkaisemattomat vaatimukset säilyttävät alkuperäisen tutkimuksen. Valmis tutkimus säilyy.
load-furn-steel-yield=Teräslevyjen määrä, joka valmistetaan 5 rautamalmista 16 sekunnissa. Vaatii suoran terässulatuksen. Oletus: 1. Vaihteluväli: 1–100. Vanhat eräreseptit skaalaavat ainekset, ajan ja tuotoksen yhdessä.
load-furn-extra-smelting=Sallii asennettujen modien soveltuvat malmista levyiksi -reseptit edistyneissä sulatusuuneissa ja lisää suoran teräksen valmistuksen vaihtoehtoja soveltuville rautapitoisille malmeille. Säilyttää malmimäärät ja kokonaisvalmistusajan. Vaatii sekä lähdereseptien teknologiat että ensimmäisen edistyneen sulatusuunin. Ei sisällä nesteitä, satunnaisia tuloksia, sivutuotteita, kierrätystä eikä kemiallisia prosesseja. Oletuksena pois käytöstä.

