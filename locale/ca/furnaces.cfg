[mod-setting-description]
load-furn-easy-research=Redueix el cost de recerca de les tecnologies dels forns avançats. Desactivat per defecte.
logist=Activa els nivells de carregadors i les cintes PRO inclosos. Activat per defecte.
load-furn-legacy=Afegeix còpies de les receptes de fosa compatibles amb lots més grans i la compatibilitat antiga amb la productivitat. Les quantitats d'ingredients, els productes i el temps de fabricació s'ajusten conjuntament. Desactivat per defecte.
load-furn-energy=Multiplica el consum d'energia dels forns. Valor per defecte: 1. Interval: de 0.1 a 5.
load-furn-crafting-speed=Factor utilitzat per a la velocitat de fabricació dels forns. Sense els lots del mode antic, la velocitat derivada de la cinta es divideix per aquest valor. En el mode antic, la velocitat base es multiplica per aquest valor. Valor per defecte: 1. Interval: de 0.1 a 5.
load-furn-pollution-speed=Multiplica la contaminació dels forns. El factor de velocitat de fabricació també afecta les emissions. Valor per defecte: 1. Interval: de 0.001 a 10.
loader-pro-use-trains=Desactivat: no es carreguen vagons. Només automàtics: carrega o descarrega trens automàtics aturats en una estació. Tots els trens aturats: també inclou els trens manuals aturats. Admet disposicions de vagons orientades als punts cardinals. Valor per defecte: desactivat.
recipe-wood-to-coal=Carbó produït a partir d'1 unitat de fusta en 10 segons. Requereix la recepta de carbó a partir de fusta. Valor per defecte: 8. Interval: d'1 a 200.
steel-plate2=Activa la recepta dels forns avançats que produeix acer directament a partir de mineral de ferro. Activat per defecte.
cool=Activa la recepta que converteix fusta en carbó. Activat per defecte.
load-furn-balance-mode=Tria la progressió de la recerca dels forns. Original conserva els requisits originals. Els perfils d'expansió afegeixen els seus paquets de ciència i prerequisits. Si falten expansions, s'utilitza el contingut disponible; si no es poden resoldre els requisits, es conserva la recerca original. Les recerques completades es mantenen.
load-furn-steel-yield=Planxes d'acer produïdes a partir de 5 minerals de ferro en 16 segons. Requereix la fosa directa d'acer. Valor per defecte: 1. Interval: d'1 a 100. Els lots del mode antic ajusten conjuntament els ingredients, el temps i els productes.
load-furn-extra-smelting=Permet als forns avançats les receptes adequades de mineral a planxa dels mods instal·lats i afegeix alternatives d'acer directe per a minerals ferrífers adequats. Conserva les quantitats de mineral i el temps total de fabricació. Requereix tant les tecnologies d'origen com el primer forn avançat. Exclou fluids, resultats aleatoris, subproductes, reciclatge i processos químics. Desactivat per defecte.

