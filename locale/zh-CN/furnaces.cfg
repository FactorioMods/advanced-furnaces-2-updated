[mod-setting-description]
load-furn-easy-research=降低高级冶炼炉技术的研究成本。默认禁用。
logist=启用附带的各级装卸机和PRO传送带。默认启用。
load-furn-legacy=为支持的冶炼配方添加批量更大的副本，并提供旧版产能兼容功能。原料数量、产量和制造时间按相同比例缩放。默认禁用。
load-furn-energy=将冶炼炉能耗乘以此值。默认值：1。范围：0.1至5。
load-furn-crafting-speed=冶炼炉制造速度的调节值。不使用旧版批量模式时，将根据传送带计算的速度除以此值。旧版模式下，将基础速度乘以此值。默认值：1。范围：0.1至5。
load-furn-pollution-speed=将冶炼炉污染量乘以此值。制造速度调节值也会影响排放量。默认值：1。范围：0.001至10。
loader-pro-use-trains=禁用：不装卸货车。仅自动列车：为停靠在车站的自动列车装货或卸货。所有已停止的列车：也包括已停止的手动列车。支持朝向东、南、西、北的货车布局。默认值：禁用。
recipe-wood-to-coal=1份木材在10秒内生产的煤矿数量。需要启用木材转煤矿配方。默认值：8。范围：1至200。
steel-plate2=启用高级冶炼炉中从铁矿直接生产钢材的配方。默认启用。
cool=启用将木材转化为煤矿的配方。默认启用。
load-furn-balance-mode=选择冶炼炉研究进程。原版保留原有要求。扩展配置会添加对应的科技包和前置条件。缺少扩展时会采用可用内容；无法确定要求时保留原有研究。已完成的研究会保留。
load-furn-steel-yield=5份铁矿在16秒内生产的钢材数量。需要启用直接炼钢。默认值：1。范围：1至100。旧版批量模式会按相同比例缩放原料、时间和产量。
load-furn-extra-smelting=允许高级冶炼炉使用已安装模组中合适的矿石制金属板配方，并为合适的含铁矿石添加直接炼钢的替代配方。保留矿石数量和总制造时间。同时需要原配方技术和第一种高级冶炼炉技术。排除流体、随机产物、副产物、回收及化学工艺。默认禁用。

