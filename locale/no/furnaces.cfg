[mod-setting-description]
load-furn-easy-research=Reduserer forskningskostnadene for de avanserte ovnsteknologiene. Deaktivert som standard.
logist=Aktiverer de medfølgende lasternivåene og PRO-transportbåndene. Aktivert som standard.
load-furn-legacy=Legger til varianter med større partier av støttede smelteoppskrifter og eldre produktivitetskompatibilitet. Ingrediensmengder, utbytte og produksjonstid skaleres sammen. Deaktivert som standard.
load-furn-energy=Multipliserer ovnenes energiforbruk. Standard: 1. Område: 0.1 til 5.
load-furn-crafting-speed=Skalering av ovnenes produksjonshastighet. Uten eldre partioppskrifter deles den båndbaserte hastigheten på denne verdien. I eldre modus multipliseres grunnhastigheten med den. Standard: 1. Område: 0.1 til 5.
load-furn-pollution-speed=Multipliserer ovnenes forurensning. Skaleringen av produksjonshastigheten påvirker også utslippene. Standard: 1. Område: 0.001 til 10.
loader-pro-use-trains=Deaktivert: ingen vognlasting. Bare automatisk: laster eller tømmer automatiske tog som står på en stasjon. Alle stansede tog: inkluderer også stansede manuelle tog. Støtter vogner orientert etter himmelretningene. Standard: deaktivert.
recipe-wood-to-coal=Kull produsert fra 1 trevirke på 10 sekunder. Krever oppskriften fra trevirke til kull. Standard: 8. Område: 1 til 200.
steel-plate2=Aktiverer den avanserte ovnsoppskriften som lager stål direkte fra jernmalm. Aktivert som standard.
cool=Aktiverer oppskriften som omdanner trevirke til kull. Aktivert som standard.
load-furn-balance-mode=Velger ovnenes forskningsprogresjon. Original beholder de opprinnelige kravene. Utvidelsesprofiler legger til sine forskningspakker og forutsetninger. Manglende utvidelser erstattes med tilgjengelig innhold; uavklarte krav beholder den opprinnelige forskningen. Fullført forskning beholdes.
load-furn-steel-yield=Stålplater produsert fra 5 jernmalm på 16 sekunder. Krever direkte stålsmelting. Standard: 1. Område: 1 til 100. Eldre partioppskrifter skalerer ingredienser, tid og utbytte sammen.
load-furn-extra-smelting=Tillater egnede oppskrifter fra malm til plater fra installerte modder i de avanserte ovnene og legger til direkte stålalternativer for egnede jernholdige malmer. Bevarer malmmengder og samlet produksjonstid. Krever både kildeteknologiene og den første avanserte ovnen. Utelukker væsker, tilfeldige resultater, biprodukter, resirkulering og kjemiske prosesser. Deaktivert som standard.

