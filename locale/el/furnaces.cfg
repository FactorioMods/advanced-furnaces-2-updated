[mod-setting-description]
load-furn-easy-research=Μειώνει το κόστος έρευνας των προηγμένων τεχνολογιών κλιβάνων. Απενεργοποιημένο από προεπιλογή.
logist=Ενεργοποιεί τις παρεχόμενες βαθμίδες φορτωτών και τους μεταφορείς PRO. Ενεργοποιημένο από προεπιλογή.
load-furn-legacy=Προσθέτει αντίγραφα των υποστηριζόμενων συνταγών τήξης για μεγαλύτερες παρτίδες και παλαιά συμβατότητα παραγωγικότητας. Οι ποσότητες συστατικών, τα προϊόντα και ο χρόνος κατασκευής κλιμακώνονται μαζί. Απενεργοποιημένο από προεπιλογή.
load-furn-energy=Πολλαπλασιάζει την κατανάλωση ενέργειας των κλιβάνων. Προεπιλογή: 1. Εύρος: 0.1 έως 5.
load-furn-crafting-speed=Κλίμακα για την ταχύτητα κατασκευής των κλιβάνων. Χωρίς τις παλαιές παρτίδες, η ταχύτητα που προκύπτει από τον ιμάντα διαιρείται με αυτήν την τιμή. Στην παλαιά λειτουργία, η βασική ταχύτητα πολλαπλασιάζεται με αυτήν. Προεπιλογή: 1. Εύρος: 0.1 έως 5.
load-furn-pollution-speed=Πολλαπλασιάζει τη ρύπανση των κλιβάνων. Η κλίμακα ταχύτητας κατασκευής επηρεάζει επίσης τις εκπομπές. Προεπιλογή: 1. Εύρος: 0.001 έως 10.
loader-pro-use-trains=Απενεργοποιημένο: καμία φόρτωση βαγονιών. Μόνο αυτόματα: φορτώνει ή εκφορτώνει αυτόματα τρένα σταματημένα σε σταθμό. Όλα τα σταματημένα τρένα: περιλαμβάνει και σταματημένα χειροκίνητα τρένα. Υποστηρίζει βαγόνια ευθυγραμμισμένα με τα τέσσερα κύρια σημεία του ορίζοντα. Προεπιλογή: απενεργοποιημένο.
recipe-wood-to-coal=Άνθρακας που παράγεται από 1 ξύλο σε 10 δευτερόλεπτα. Απαιτεί τη συνταγή μετατροπής ξύλου σε άνθρακα. Προεπιλογή: 8. Εύρος: 1 έως 200.
steel-plate2=Ενεργοποιεί τη συνταγή προηγμένου κλιβάνου που παράγει χάλυβα απευθείας από σιδηρομετάλλευμα. Ενεργοποιημένο από προεπιλογή.
cool=Ενεργοποιεί τη συνταγή που μετατρέπει το ξύλο σε άνθρακα. Ενεργοποιημένο από προεπιλογή.
load-furn-balance-mode=Επιλέγει την εξέλιξη της έρευνας κλιβάνων. Το Αρχικό διατηρεί τις αρχικές απαιτήσεις. Τα προφίλ επεκτάσεων προσθέτουν τα επιστημονικά πακέτα και τα προαπαιτούμενά τους. Για επεκτάσεις που λείπουν χρησιμοποιείται διαθέσιμο περιεχόμενο· οι ανεπίλυτες απαιτήσεις διατηρούν την αρχική έρευνα. Η ολοκληρωμένη έρευνα διατηρείται.
load-furn-steel-yield=Πλάκες χάλυβα που παράγονται από 5 σιδηρομεταλλεύματα σε 16 δευτερόλεπτα. Απαιτεί άμεση τήξη χάλυβα. Προεπιλογή: 1. Εύρος: 1 έως 100. Οι παλαιές παρτίδες κλιμακώνουν συστατικά, χρόνο και προϊόντα μαζί.
load-furn-extra-smelting=Επιτρέπει κατάλληλες συνταγές από μετάλλευμα σε πλάκα από εγκατεστημένα mod στους προηγμένους κλιβάνους και προσθέτει εναλλακτικές άμεσης παραγωγής χάλυβα για κατάλληλα σιδηρούχα μεταλλεύματα. Διατηρεί τις ποσότητες μεταλλεύματος και τον συνολικό χρόνο κατασκευής. Απαιτεί τόσο τις τεχνολογίες προέλευσης όσο και τον πρώτο προηγμένο κλίβανο. Εξαιρεί ρευστά, τυχαία αποτελέσματα, παραπροϊόντα, ανακύκλωση και χημικές διεργασίες. Απενεργοποιημένο από προεπιλογή.

