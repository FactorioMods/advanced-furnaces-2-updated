[mod-setting-description]
load-furn-easy-research=Csökkenti a fejlett kemencék technológiáinak kutatási költségét. Alapértelmezetten kikapcsolva.
logist=Engedélyezi a mellékelt rakodófokozatokat és a PRO futószalagokat. Alapértelmezetten bekapcsolva.
load-furn-legacy=Nagyobb adagokkal dolgozó másolatokat ad a támogatott olvasztási receptekhez, valamint kompatibilitást a régi termelékenységi működéssel. Az alapanyagok mennyisége, a kimenet és a gyártási idő együtt, arányosan változik. Alapértelmezetten kikapcsolva.
load-furn-energy=Megszorozza a kemencék energiafogyasztását. Alapérték: 1. Tartomány: 0.1–5.
load-furn-crafting-speed=A kemencék gyártási sebességének skálázási értéke. A régi nagy adagú receptek nélkül a futószalagból számított sebességet elosztja ezzel az értékkel. Régi módban az alapsebességet megszorozza vele. Alapérték: 1. Tartomány: 0.1–5.
load-furn-pollution-speed=Megszorozza a kemencék szennyezését. A gyártási sebesség skálázása is hat a kibocsátásra. Alapérték: 1. Tartomány: 0.001–10.
loader-pro-use-trains=Kikapcsolva: nincs vagonrakodás. Csak automatikus: az állomáson álló, automatikus módban lévő vonatokat rakodja be vagy ki. Minden álló vonat: az álló, kézi vezérlésű vonatokat is magában foglalja. Támogatja a fő égtájakhoz igazodó vagonelrendezéseket. Alapértelmezés: kikapcsolva.
recipe-wood-to-coal=Az 1 fából 10 másodperc alatt előállított szén mennyisége. Szükséges hozzá a fából szenet készítő recept. Alapérték: 8. Tartomány: 1–200.
steel-plate2=Engedélyezi a fejlett kemence receptjét, amely közvetlenül vasércből készít acélt. Alapértelmezetten bekapcsolva.
cool=Engedélyezi a fát szénné alakító receptet. Alapértelmezetten bekapcsolva.
load-furn-balance-mode=Kiválasztja a kemencék kutatási előrehaladását. Az eredeti profil megtartja az eredeti követelményeket. A kiegészítők profiljai hozzáadják saját tudományos csomagjaikat és előfeltételeiket. Hiányzó kiegészítők esetén az elérhető tartalmat használja; ha a követelmények nem határozhatók meg, megtartja az eredeti kutatást. A befejezett kutatások megmaradnak.
load-furn-steel-yield=Az 5 vasércből 16 másodperc alatt előállított acéllemezek száma. Közvetlen acélolvasztást igényel. Alapérték: 1. Tartomány: 1–100. A régi nagy adagú receptek az alapanyagokat, az időt és a kimenetet együtt, arányosan módosítják.
load-furn-extra-smelting=Engedélyezi a telepített modok megfelelő, ércből lemezt készítő receptjeit a fejlett kemencékben, és közvetlen acélgyártási változatokat ad a megfelelő vastartalmú ércekhez. Megőrzi az ércmennyiségeket és a teljes gyártási időt. Az eredeti technológiákat és az első fejlett kemencét egyaránt igényli. Kizárja a folyadékokat, véletlenszerű eredményeket, melléktermékeket, újrahasznosítást és vegyi folyamatokat. Alapértelmezetten kikapcsolva.

