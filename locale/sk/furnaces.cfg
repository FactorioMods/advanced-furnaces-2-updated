[mod-setting-description]
load-furn-easy-research=Znižuje náklady na výskum technológií pokročilých pecí. Predvolene vypnuté.
logist=Povoľuje pribalené úrovne nakladačov a pásy PRO. Predvolene zapnuté.
load-furn-legacy=Pridáva kópie podporovaných taviacich receptov s väčšími dávkami a kompatibilitu s produktivitou zo starších verzií. Množstvá surovín, výstup a čas výroby sa menia v rovnakom pomere. Predvolene vypnuté.
load-furn-energy=Násobí spotrebu energie pecí. Predvolená hodnota: 1. Rozsah: 0.1 až 5.
load-furn-crafting-speed=Koeficient rýchlosti výroby pecí. Bez dávkových receptov zo starších verzií sa rýchlosť odvodená od pásu delí touto hodnotou. V staršom režime sa ňou násobí základná rýchlosť. Predvolená hodnota: 1. Rozsah: 0.1 až 5.
load-furn-pollution-speed=Násobí znečistenie pecí. Emisie ovplyvňuje aj koeficient rýchlosti výroby. Predvolená hodnota: 1. Rozsah: 0.001 až 10.
loader-pro-use-trains=Vypnuté: žiadne nakladanie vagónov. Iba automatické: nakladá alebo vykladá vlaky v automatickom režime stojace v stanici. Všetky stojace vlaky: zahŕňa aj stojace vlaky v ručnom režime. Podporuje vagóny orientované podľa hlavných svetových strán. Predvolené nastavenie: vypnuté.
recipe-wood-to-coal=Uhlie vyrobené z 1 kusa dreva za 10 sekúnd. Vyžaduje recept na uhlie z dreva. Predvolená hodnota: 8. Rozsah: 1 až 200.
steel-plate2=Povoľuje recept pokročilej pece na výrobu ocele priamo zo železnej rudy. Predvolene zapnuté.
cool=Povoľuje recept na premenu dreva na uhlie. Predvolene zapnuté.
load-furn-balance-mode=Vyberá postup výskumu pecí. Pôvodný profil zachováva pôvodné požiadavky. Profily rozšírení pridávajú svoje vedecké balíčky a predpoklady. Ak rozšírenia chýbajú, použije sa dostupný obsah; ak požiadavky nemožno určiť, zachová sa pôvodný výskum. Dokončené výskumy zostávajú zachované.
load-furn-steel-yield=Oceľové pláty vyrobené z 5 kusov železnej rudy za 16 sekúnd. Vyžaduje priame tavenie ocele. Predvolená hodnota: 1. Rozsah: 1 až 100. Dávkové recepty zo starších verzií menia suroviny, čas a výstup v rovnakom pomere.
load-furn-extra-smelting=Umožňuje v pokročilých peciach vhodné recepty na tavenie rudy na pláty z nainštalovaných modov a pridáva alternatívy priamej výroby ocele z vhodných rúd obsahujúcich železo. Zachováva množstvá rudy aj celkový čas výroby. Vyžaduje zdrojové technológie aj prvú pokročilú pec. Vylučuje tekutiny, náhodné výsledky, vedľajšie produkty, recykláciu a chemické procesy. Predvolene vypnuté.

