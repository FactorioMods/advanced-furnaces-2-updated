[mod-setting-description]
load-furn-easy-research=Gelişmiş fırın teknolojilerinin araştırma maliyetini azaltır. Varsayılan olarak devre dışıdır.
logist=Birlikte gelen yükleyici kademelerini ve PRO taşıyıcılarını etkinleştirir. Varsayılan olarak etkindir.
load-furn-legacy=Desteklenen eritme tariflerinin daha büyük partiler üreten kopyalarını ve eski üretkenlik uyumluluğunu ekler. Malzeme miktarları, çıktı ve üretim süresi birlikte ölçeklenir. Varsayılan olarak devre dışıdır.
load-furn-energy=Fırınların enerji tüketimini çarpar. Varsayılan: 1. Aralık: 0.1 ile 5.
load-furn-crafting-speed=Fırın üretim hızı için kullanılan ölçek. Eski toplu üretim kapalıyken banttan türetilen hız bu değere bölünür. Eski modda temel hız bu değerle çarpılır. Varsayılan: 1. Aralık: 0.1 ile 5.
load-furn-pollution-speed=Fırınların kirliliğini çarpar. Üretim hızı ölçeği de salımları etkiler. Varsayılan: 1. Aralık: 0.001 ile 10.
loader-pro-use-trains=Devre dışı: vagon yüklemesi yapılmaz. Yalnızca otomatik: istasyonda durmuş otomatik trenleri yükler veya boşaltır. Duran tüm trenler: durmuş elle yönetilen trenleri de kapsar. Ana yönlere hizalanmış vagon yerleşimlerini destekler. Varsayılan: devre dışı.
recipe-wood-to-coal=1 odundan 10 saniyede üretilen kömür miktarı. Odundan kömüre dönüşüm tarifini gerektirir. Varsayılan: 8. Aralık: 1 ile 200.
steel-plate2=Demir cevherinden doğrudan çelik üreten gelişmiş fırın tarifini etkinleştirir. Varsayılan olarak etkindir.
cool=Odunu kömüre dönüştüren tarifi etkinleştirir. Varsayılan olarak etkindir.
load-furn-balance-mode=Fırın araştırmasının ilerleyişini seçer. Özgün, özgün gereksinimleri korur. Genişletme profilleri kendi bilim paketlerini ve ön koşullarını ekler. Eksik genişletmeler için kullanılabilir içerik esas alınır; çözümlenemeyen gereksinimlerde özgün araştırma korunur. Tamamlanan araştırmalar korunur.
load-furn-steel-yield=5 demir cevherinden 16 saniyede üretilen çelik levha miktarı. Doğrudan çelik eritmeyi gerektirir. Varsayılan: 1. Aralık: 1 ile 100. Eski toplu üretim, malzemeleri, süreyi ve çıktıyı birlikte ölçekler.
load-furn-extra-smelting=Kurulu modların uygun cevherden levha üretim tariflerini gelişmiş fırınlarda kullanmaya izin verir ve uygun demir içeren cevherler için doğrudan çelik üretim alternatifleri ekler. Cevher miktarlarını ve toplam üretim süresini korur. Hem kaynak teknolojileri hem de ilk gelişmiş fırını gerektirir. Akışkanları, rastgele sonuçları, yan ürünleri, geri dönüşümü ve kimyasal işlemleri kapsam dışında bırakır. Varsayılan olarak devre dışıdır.

