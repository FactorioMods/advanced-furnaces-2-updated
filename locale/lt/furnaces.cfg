[mod-setting-description]
load-furn-easy-research=Sumažina pažangių krosnių technologijų tyrimų kainą. Pagal numatymą išjungta.
logist=Įjungia pridėtas krautuvų pakopas ir PRO konvejerius. Pagal numatymą įjungta.
load-furn-legacy=Prideda palaikomų lydymo receptų kopijas didesnėms partijoms ir senąjį suderinamumą su našumu. Sudedamųjų dalių kiekiai, produkcija ir gamybos laikas keičiami proporcingai kartu. Pagal numatymą išjungta.
load-furn-energy=Padaugina krosnių energijos sąnaudas. Numatytoji reikšmė: 1. Intervalas: nuo 0.1 iki 5.
load-furn-crafting-speed=Krosnių gamybos greičio mastelis. Nenaudojant senųjų partijų receptų, pagal konvejerį apskaičiuotas greitis dalijamas iš šios reikšmės. Senajame režime bazinis greitis iš jos dauginamas. Numatytoji reikšmė: 1. Intervalas: nuo 0.1 iki 5.
load-furn-pollution-speed=Padaugina krosnių taršą. Gamybos greičio mastelis taip pat veikia išmetamų teršalų kiekį. Numatytoji reikšmė: 1. Intervalas: nuo 0.001 iki 10.
loader-pro-use-trains=Išjungta: vagonai nekraunami. Tik automatiniai: pakrauna arba iškrauna stotyje sustojusius automatinius traukinius. Visi sustoję traukiniai: apima ir sustojusius rankiniu būdu valdomus traukinius. Palaiko vagonų išdėstymą pagrindinėmis pasaulio kryptimis. Numatyta: išjungta.
recipe-wood-to-coal=Anglių kiekis, pagaminamas iš 1 medienos vieneto per 10 sekundžių. Reikia medienos vertimo anglimis recepto. Numatytoji reikšmė: 8. Intervalas: nuo 1 iki 200.
steel-plate2=Įjungia pažangios krosnies receptą, gaminantį plieną tiesiai iš geležies rūdos. Pagal numatymą įjungta.
cool=Įjungia receptą, paverčiantį medieną anglimis. Pagal numatymą įjungta.
load-furn-balance-mode=Parenka krosnių tyrimų eigą. Pradinė išlaiko pradinius reikalavimus. Papildinių profiliai prideda savo mokslo paketus ir išankstines sąlygas. Trūkstant papildinių naudojamas prieinamas turinys; nepavykus nustatyti reikalavimų paliekami pradiniai tyrimai. Baigti tyrimai išsaugomi.
load-furn-steel-yield=Plieninių sijų kiekis, pagaminamas iš 5 geležies rūdos vienetų per 16 sekundžių. Reikia tiesioginio plieno lydymo. Numatytoji reikšmė: 1. Intervalas: nuo 1 iki 100. Senieji partijų receptai proporcingai kartu keičia sudedamąsias dalis, laiką ir produkciją.
load-furn-extra-smelting=Leidžia pažangiose krosnyse naudoti tinkamus įdiegtų modifikacijų rūdos vertimo plokštėmis receptus ir prideda tiesioginės plieno gamybos alternatyvas tinkamoms geležies turinčioms rūdoms. Išsaugo rūdos kiekius ir bendrą gamybos laiką. Reikia ir pradinių receptų technologijų, ir pirmos pažangios krosnies. Neįtraukia skysčių, atsitiktinių rezultatų, šalutinių produktų, perdirbimo ir cheminių procesų. Pagal numatymą išjungta.

