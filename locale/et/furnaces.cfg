[mod-setting-description]
load-furn-easy-research=Vähendab täiustatud ahjutehnoloogiate uurimiskulusid. Vaikimisi välja lülitatud.
logist=Lubab kaasasolevad laaduritasemed ja PRO-konveierid. Vaikimisi sisse lülitatud.
load-furn-legacy=Lisab toetatud sulatusretseptide suuremate partiidega koopiad ja vana tootlikkuse ühilduvuse. Koostisosade kogused, toodang ja tootmisaeg skaleeruvad koos. Vaikimisi välja lülitatud.
load-furn-energy=Korrutab ahjude energiatarvet. Vaikeväärtus: 1. Vahemik: 0.1 kuni 5.
load-furn-crafting-speed=Ahjude tootmiskiiruse skaleerimine. Ilma vanade partiiretseptideta jagatakse konveierist tuletatud kiirus selle väärtusega. Vanas režiimis korrutatakse sellega baaskiirust. Vaikeväärtus: 1. Vahemik: 0.1 kuni 5.
load-furn-pollution-speed=Korrutab ahjude saastet. Tootmiskiiruse skaleerimine mõjutab samuti heitmeid. Vaikeväärtus: 1. Vahemik: 0.001 kuni 10.
loader-pro-use-trains=Välja lülitatud: vaguneid ei laadita. Ainult automaatsed: laadib või tühjendab jaamas seisvaid automaatseid ronge. Kõik seisvad rongid: hõlmab ka seisvaid käsitsi juhitavaid ronge. Toetab põhiilmakaarte suunalisi vaguneid. Vaikimisi välja lülitatud.
recipe-wood-to-coal=Kivisöe kogus, mis toodetakse 1 puidust 10 sekundiga. Nõuab puidust kivisöe valmistamise retsepti. Vaikeväärtus: 8. Vahemik: 1 kuni 200.
steel-plate2=Lubab täiustatud ahju retsepti, mis valmistab terast otse rauamaagist. Vaikimisi sisse lülitatud.
cool=Lubab retsepti, mis muudab puidu kivisöeks. Vaikimisi sisse lülitatud.
load-furn-balance-mode=Valib ahjude uurimistöö edenemise. Algne säilitab algsed nõuded. Laiendusprofiilid lisavad oma teaduspakid ja eeltingimused. Puuduvate laienduste asemel kasutatakse saadaolevat sisu; lahendamata nõuete korral säilib algne uurimistöö. Lõpetatud uurimistöö säilib.
load-furn-steel-yield=Terasplaatide kogus, mis toodetakse 5 rauamaagist 16 sekundiga. Nõuab otsest terasesulatust. Vaikeväärtus: 1. Vahemik: 1 kuni 100. Vanad partiiretseptid skaleerivad koostisosi, aega ja toodangut koos.
load-furn-extra-smelting=Lubab täiustatud ahjudes paigaldatud modifikatsioonide sobivaid maagist plaatide valmistamise retsepte ja lisab sobivatele rauda sisaldavatele maakidele otsese terasetootmise alternatiivid. Säilitab maagikogused ja kogu tootmisaja. Nõuab nii lähteretseptide tehnoloogiaid kui ka esimest täiustatud ahju. Välistab vedelikud, juhuslikud tulemused, kõrvalsaadused, ringlussevõtu ja keemilised protsessid. Vaikimisi välja lülitatud.

