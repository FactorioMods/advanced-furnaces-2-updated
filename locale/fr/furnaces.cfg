[mod-setting-description]
load-furn-easy-research=Réduit le coût de recherche des technologies de fours avancés. Désactivé par défaut.
logist=Active les niveaux de chargeurs et les convoyeurs PRO fournis. Activé par défaut.
load-furn-legacy=Ajoute des copies des recettes de fusion compatibles utilisant des lots plus importants, ainsi que l'ancienne compatibilité avec la productivité. Les quantités d'ingrédients, les produits et le temps de fabrication sont ajustés ensemble. Désactivé par défaut.
load-furn-energy=Multiplie la consommation d'énergie des fours. Valeur par défaut : 1. Plage : de 0.1 à 5.
load-furn-crafting-speed=Facteur utilisé pour la vitesse de fabrication des fours. Sans les lots à l'ancienne, la vitesse dérivée du convoyeur est divisée par cette valeur. En mode ancien, la vitesse de base est multipliée par cette valeur. Valeur par défaut : 1. Plage : de 0.1 à 5.
load-furn-pollution-speed=Multiplie la pollution des fours. Le facteur de vitesse de fabrication influe aussi sur les émissions. Valeur par défaut : 1. Plage : de 0.001 à 10.
loader-pro-use-trains=Désactivé : aucun chargement de wagon. Automatique uniquement : charge ou décharge les trains automatiques arrêtés en gare. Tous les trains arrêtés : inclut aussi les trains manuels arrêtés. Prend en charge les dispositions de wagons selon les points cardinaux. Valeur par défaut : désactivé.
recipe-wood-to-coal=Charbon produit à partir de 1 bois en 10 secondes. Nécessite la recette de charbon à partir de bois. Valeur par défaut : 8. Plage : de 1 à 200.
steel-plate2=Active la recette des fours avancés qui produit de l'acier directement à partir de minerai de fer. Activé par défaut.
cool=Active la recette qui transforme le bois en charbon. Activé par défaut.
load-furn-balance-mode=Choisit la progression de la recherche sur les fours. Original conserve les exigences d'origine. Les profils d'extension ajoutent leurs packs de science et leurs prérequis. Si une extension manque, le contenu disponible est utilisé ; si des exigences restent introuvables, la recherche d'origine est conservée. Les recherches terminées sont conservées.
load-furn-steel-yield=Plaques d'acier produites à partir de 5 minerais de fer en 16 secondes. Nécessite la fusion directe de l'acier. Valeur par défaut : 1. Plage : de 1 à 100. Les lots à l'ancienne ajustent ensemble les ingrédients, le temps et les produits.
load-furn-extra-smelting=Autorise dans les fours avancés les recettes appropriées de minerai en plaques des mods installés et ajoute des variantes produisant directement de l'acier à partir de minerais ferrifères appropriés. Conserve les quantités de minerai et le temps total de fabrication. Nécessite à la fois les technologies d'origine et le premier four avancé. Exclut les fluides, les résultats aléatoires, les sous-produits, le recyclage et les procédés chimiques. Désactivé par défaut.

