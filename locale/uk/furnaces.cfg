[mod-setting-description]
load-furn-easy-research=Зменшує вартість дослідження технологій удосконалених печей. Типово вимкнено.
logist=Умикає вбудовані рівні завантажувачів і конвеєри PRO. Типово ввімкнено.
load-furn-legacy=Додає копії підтримуваних рецептів плавлення зі збільшеними партіями та сумісність із продуктивністю попередніх версій. Кількість інгредієнтів, вихід продукції та час виробництва масштабуються разом. Типово вимкнено.
load-furn-energy=Множить енергоспоживання печей. Типово: 1. Діапазон: від 0.1 до 5.
load-furn-crafting-speed=Коефіцієнт швидкості виробництва печей. Без пакетних рецептів попередніх версій швидкість, обчислена за конвеєром, ділиться на це значення. У режимі попередніх версій базова швидкість множиться на нього. Типово: 1. Діапазон: від 0.1 до 5.
load-furn-pollution-speed=Множить забруднення від печей. Коефіцієнт швидкості виробництва також впливає на викиди. Типово: 1. Діапазон: від 0.001 до 10.
loader-pro-use-trains=Вимкнено: завантаження вагонів вимкнене. Лише автоматичні: завантажує або розвантажує поїзди в автоматичному режимі, що зупинилися на станції. Усі зупинені поїзди: також охоплює зупинені поїзди в ручному режимі. Підтримуються вагони, орієнтовані за сторонами світу. Типово: вимкнено.
recipe-wood-to-coal=Кількість вугілля, отриманого з 1 одиниці деревини за 10 секунд. Потрібен рецепт вугілля з деревини. Типово: 8. Діапазон: від 1 до 200.
steel-plate2=Умикає рецепт удосконаленої печі для виробництва сталі безпосередньо із залізної руди. Типово ввімкнено.
cool=Умикає рецепт перетворення деревини на вугілля. Типово ввімкнено.
load-furn-balance-mode=Вибирає послідовність дослідження печей. Початковий профіль зберігає початкові вимоги. Профілі доповнень додають відповідні дослідницькі пакети й передумови. За відсутності доповнень використовується доступний вміст; якщо вимоги не вдається визначити, зберігається початкове дослідження. Завершені дослідження зберігаються.
load-furn-steel-yield=Кількість сталевих балок, отриманих із 5 одиниць залізної руди за 16 секунд. Потрібне пряме виплавлення сталі. Типово: 1. Діапазон: від 1 до 100. Пакетні рецепти попередніх версій разом масштабують інгредієнти, час і вихід продукції.
load-furn-extra-smelting=Дозволяє відповідні рецепти виплавлення плит із руди зі встановлених модів в удосконалених печах і додає варіанти прямого виплавлення сталі з відповідних залізовмісних руд. Зберігає кількість руди й загальний час виробництва. Потрібні як вихідні технології, так і перша вдосконалена піч. Виключає рідини, випадкові результати, побічні продукти, перероблення вторсировини й хімічні процеси. Типово вимкнено.

