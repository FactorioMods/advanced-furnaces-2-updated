[mod-setting-description]
load-furn-easy-research=Minskar forskningskostnaden för de avancerade ugnsteknikerna. Inaktiverat som standard.
logist=Aktiverar de medföljande lastarnivåerna och PRO-transportbanden. Aktiverat som standard.
load-furn-legacy=Lägger till varianter med större satser av smältrecept som stöds samt äldre produktivitetskompatibilitet. Ingrediensmängder, utbyte och tillverkningstid skalas tillsammans. Inaktiverat som standard.
load-furn-energy=Multiplicerar ugnarnas energiförbrukning. Standard: 1. Intervall: 0.1 till 5.
load-furn-crafting-speed=Skalning av ugnarnas tillverkningshastighet. Utan äldre satsrecept divideras den bandbaserade hastigheten med detta värde. I äldre läge multipliceras grundhastigheten med det. Standard: 1. Intervall: 0.1 till 5.
load-furn-pollution-speed=Multiplicerar ugnarnas föroreningar. Skalningen av tillverkningshastigheten påverkar också utsläppen. Standard: 1. Intervall: 0.001 till 10.
loader-pro-use-trains=Inaktiverat: ingen vagnlastning. Endast automatiska: lastar eller lossar automatiska tåg som står vid en station. Alla stillastående tåg: omfattar även stillastående manuella tåg. Stöder vagnar riktade längs huvudväderstrecken. Standard: inaktiverat.
recipe-wood-to-coal=Kol som tillverkas av 1 trä på 10 sekunder. Kräver receptet för trä till kol. Standard: 8. Intervall: 1 till 200.
steel-plate2=Aktiverar det avancerade ugnsreceptet som tillverkar stål direkt från järnmalm. Aktiverat som standard.
cool=Aktiverar receptet som omvandlar trä till kol. Aktiverat som standard.
load-furn-balance-mode=Väljer ugnarnas forskningsutveckling. Ursprunglig behåller de ursprungliga kraven. Expansionsprofiler lägger till sina forskningspaket och förkunskapskrav. Saknade expansioner ersätts med tillgängligt innehåll; olösta krav behåller den ursprungliga forskningen. Slutförd forskning behålls.
load-furn-steel-yield=Stålplåtar som tillverkas av 5 järnmalm på 16 sekunder. Kräver direkt stålsmältning. Standard: 1. Intervall: 1 till 100. Äldre satsrecept skalar ingredienser, tid och utbyte tillsammans.
load-furn-extra-smelting=Tillåter lämpliga recept från malm till plåt från installerade moddar i de avancerade ugnarna och lägger till direkta stålalternativ för lämpliga järnhaltiga malmer. Bevarar malmmängder och total tillverkningstid. Kräver både källteknikerna och den första avancerade ugnen. Utesluter vätskor, slumpmässiga resultat, biprodukter, återvinning och kemiska processer. Inaktiverat som standard.

