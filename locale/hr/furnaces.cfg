[mod-setting-description]
load-furn-easy-research=Smanjuje trošak istraživanja tehnologija naprednih peći. Zadano isključeno.
logist=Omogućuje priložene razine utovarivača i trake PRO. Zadano uključeno.
load-furn-legacy=Dodaje kopije podržanih recepata za taljenje s većim serijama i kompatibilnost s produktivnošću iz starijih verzija. Količine sastojaka, izlazna količina i vrijeme proizvodnje mijenjaju se zajedno u istom omjeru. Zadano isključeno.
load-furn-energy=Množi potrošnju energije peći. Zadano: 1. Raspon: od 0.1 do 5.
load-furn-crafting-speed=Faktor brzine proizvodnje peći. Bez većih serija iz starijih verzija brzina izvedena iz trake dijeli se ovom vrijednošću. U starom načinu rada osnovna se brzina množi njome. Zadano: 1. Raspon: od 0.1 do 5.
load-furn-pollution-speed=Množi onečišćenje peći. Faktor brzine proizvodnje također utječe na emisije. Zadano: 1. Raspon: od 0.001 do 10.
loader-pro-use-trains=Isključeno: nema utovara vagona. Samo automatski: utovaruje ili istovaruje vlakove u automatskom načinu rada zaustavljene na postaji. Svi zaustavljeni vlakovi: uključuje i zaustavljene vlakove u ručnom načinu rada. Podržava vagone usmjerene prema glavnim stranama svijeta. Zadano: isključeno.
recipe-wood-to-coal=Ugljen proizveden iz 1 jedinice drva za 10 sekundi. Zahtijeva recept za ugljen iz drva. Zadano: 8. Raspon: od 1 do 200.
steel-plate2=Omogućuje recept napredne peći koji proizvodi čelik izravno iz željezne rude. Zadano uključeno.
cool=Omogućuje recept koji pretvara drvo u ugljen. Zadano uključeno.
load-furn-balance-mode=Odabire slijed istraživanja peći. Izvorni profil zadržava izvorne zahtjeve. Profili proširenja dodaju svoje znanstvene pakete i preduvjete. Ako proširenja nedostaju, koristi se dostupan sadržaj; ako se zahtjevi ne mogu odrediti, zadržava se izvorno istraživanje. Dovršena istraživanja ostaju sačuvana.
load-furn-steel-yield=Čelične ploče proizvedene iz 5 jedinica željezne rude za 16 sekundi. Zahtijeva izravno taljenje čelika. Zadano: 1. Raspon: od 1 do 100. Veće serije iz starijih verzija zajedno mijenjaju sastojke, vrijeme i izlaznu količinu u istom omjeru.
load-furn-extra-smelting=Omogućuje prikladne recepte za taljenje rude u ploče iz instaliranih modova u naprednim pećima i dodaje varijante izravne proizvodnje čelika za prikladne rude koje sadrže željezo. Čuva količine rude i ukupno vrijeme proizvodnje. Zahtijeva i izvorne tehnologije i prvu naprednu peć. Isključuje tekućine, nasumične rezultate, nusproizvode, recikliranje i kemijske procese. Zadano isključeno.

