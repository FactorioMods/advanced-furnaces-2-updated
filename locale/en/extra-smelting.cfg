[mod-setting-name]
load-furn-extra-smelting=Additional ore smelting

[mod-setting-description]
load-furn-extra-smelting=Opt-in: adds existing furnace categories backed by deterministic ore-to-plate recipes, excluding recycling, chemistry and generic crafting to all five advanced furnaces. Also composes deterministic, single-ore iron smelting recipes into direct steel alternatives for other ores, preserving source ore quantities and total crafting time. Both source research unlocks and the first advanced furnace are required; the alternative costs one research unit using the first furnace’s science packs. Existing recipes remain unchanged. Foundry-only categories are excluded.

