[mod-setting-description]
load-furn-easy-research=Reduces the research cost of the advanced furnace technologies. Disabled by default.
logist=Enables the bundled loader tiers and PRO conveyors. Enabled by default.
load-furn-legacy=Adds larger-batch copies of supported smelting recipes and legacy productivity compatibility. Ingredient amounts, output and crafting time scale together. Disabled by default.
load-furn-energy=Multiplies furnace energy consumption. Default: 1. Range: 0.1 to 5.
load-furn-crafting-speed=Scale used for furnace crafting speed. Without legacy batching, belt-derived speed is divided by this value. In legacy mode, base speed is multiplied by it. Default: 1. Range: 0.1 to 5.
load-furn-pollution-speed=Multiplies furnace pollution. The crafting speed scale also affects emissions. Default: 1. Range: 0.001 to 10.
loader-pro-use-trains=Disabled: no wagon loading. Automatic only: loads or unloads automatic trains stopped at a station. All stopped trains: also includes stopped manual trains. Supports cardinal wagon layouts. Default: disabled.
recipe-wood-to-coal=Coal produced from 1 wood in 10 seconds. Requires the wood-to-coal recipe. Default: 8. Range: 1 to 200.
steel-plate2=Enables the advanced furnace recipe that makes steel directly from iron ore. Enabled by default.
cool=Enables the recipe that converts wood into coal. Enabled by default.
load-furn-balance-mode=Chooses furnace research progression. Original keeps the original requirements. Expansion profiles add their science packs and prerequisites. Missing expansions fall back to available content; unresolved requirements keep the original research. Completed research is retained.
load-furn-steel-yield=Steel plates produced from 5 iron ore in 16 seconds. Requires direct steel smelting. Default: 1. Range: 1 to 100. Legacy batching scales ingredients, time and output together.
load-furn-extra-smelting=Allows suitable ore-to-plate recipes from installed mods in the advanced furnaces and adds direct steel alternatives for suitable iron-bearing ores. Preserves ore quantities and total crafting time. Requires both source technologies and the first advanced furnace. Excludes fluids, random results, byproducts, recycling and chemical processes. Disabled by default.

