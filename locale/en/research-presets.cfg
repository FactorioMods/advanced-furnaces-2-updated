[mod-setting-name]
load-furn-balance-mode=Research progression preset
load-furn-steel-yield=Steel output per 5 iron ore

[mod-setting-description]
load-furn-balance-mode=Original preserves existing research. Other presets add science packs and their unlock prerequisites. Missing expansion mods fall back to the available expansion or vanilla; unavailable science packs or unsafe prerequisites preserve original research. Reduced technology costs still applies. Existing researched technologies stay researched.
load-furn-steel-yield=Number of steel plates produced by the special steel recipe from 5 iron ore in 16 seconds. Default: 1. Range: 1–100. Requires the special steel recipe setting. Legacy batching multiplies ingredients, time and output together.

[string-mod-setting]
load-furn-balance-mode-unbalanced=Original
load-furn-balance-mode-vanilla=Vanilla
load-furn-balance-mode-space-age=Space Age
load-furn-balance-mode-space-exploration=Space Exploration
load-furn-balance-mode-sesa=Space Exploration + Space Age
