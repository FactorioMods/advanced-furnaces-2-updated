[mod-setting-description]
load-furn-easy-research=Змяншае кошт даследавання тэхналогій удасканаленых печаў. Прадвызначана выключана.
logist=Уключае ўбудаваныя ўзроўні пагрузчыкаў і канвееры PRO. Прадвызначана ўключана.
load-furn-legacy=Дадае копіі падтрымліваемых рэцэптаў плаўлення з большымі партыямі і сумяшчальнасць з прадукцыйнасцю старых версій. Колькасць інгрэдыентаў, выхад прадукцыі і час вытворчасці змяняюцца разам у аднолькавай прапорцыі. Прадвызначана выключана.
load-furn-energy=Памнажае энергаспажыванне печаў. Прадвызначана: 1. Дыяпазон: ад 0.1 да 5.
load-furn-crafting-speed=Каэфіцыент хуткасці вытворчасці печаў. Без вялікіх партый са старых версій хуткасць, разлічаная паводле канвеера, дзеліцца на гэта значэнне. У рэжыме старых версій базавая хуткасць памнажаецца на яго. Прадвызначана: 1. Дыяпазон: ад 0.1 да 5.
load-furn-pollution-speed=Памнажае забруджванне ад печаў. Каэфіцыент хуткасці вытворчасці таксама ўплывае на выкіды. Прадвызначана: 1. Дыяпазон: ад 0.001 да 10.
loader-pro-use-trains=Выключана: без загрузкі вагонаў. Толькі аўтаматычныя: загружае або разгружае цягнікі ў аўтаматычным рэжыме, спыненыя на станцыі. Усе спыненыя цягнікі: таксама ўключае спыненыя цягнікі ў ручным рэжыме. Падтрымліваюцца вагоны, арыентаваныя паводле асноўных бакоў свету. Прадвызначана: выключана.
recipe-wood-to-coal=Колькасць вугалю, вырабленага з 1 адзінкі драўніны за 10 секунд. Патрабуе рэцэпта вугалю з драўніны. Прадвызначана: 8. Дыяпазон: ад 1 да 200.
steel-plate2=Уключае рэцэпт удасканаленай печы для вытворчасці сталі непасрэдна з жалезнай руды. Прадвызначана ўключана.
cool=Уключае рэцэпт ператварэння драўніны ў вугаль. Прадвызначана ўключана.
load-furn-balance-mode=Выбірае паслядоўнасць даследавання печаў. Зыходны профіль захоўвае зыходныя патрабаванні. Профілі дапаўненняў дадаюць адпаведныя навуковыя пакеты і папярэднія ўмовы. Пры адсутнасці дапаўненняў выкарыстоўваецца даступны змест; калі патрабаванні немагчыма вызначыць, захоўваецца зыходнае даследаванне. Завершаныя даследаванні захоўваюцца.
load-furn-steel-yield=Сталёвыя пласціны, вырабленыя з 5 адзінак жалезнай руды за 16 секунд. Патрабуе непасрэднага выплаўлення сталі. Прадвызначана: 1. Дыяпазон: ад 1 да 100. Вялікія партыі са старых версій змяняюць інгрэдыенты, час і выхад прадукцыі разам у аднолькавай прапорцыі.
load-furn-extra-smelting=Дазваляе ўдасканаленым печам выкарыстоўваць прыдатныя рэцэпты выплаўлення пласцін з руды з усталяваных модаў і дадае варыянты непасрэднай вытворчасці сталі з прыдатных жалезазмяшчальных руд. Захоўвае колькасць руды і агульны час вытворчасці. Патрабуе як зыходных тэхналогій, так і першай удасканаленай печы. Выключае вадкасці, выпадковыя вынікі, пабочныя прадукты, перапрацоўку другаснай сыравіны і хімічныя працэсы. Прадвызначана выключана.

