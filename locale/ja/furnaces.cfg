[mod-setting-description]
load-furn-easy-research=上位製錬炉技術の研究コストを削減します。デフォルトでは無効です。
logist=付属の各段階のローダーとPRO搬送ベルトを有効にします。デフォルトでは有効です。
load-furn-legacy=対応する製錬レシピをまとめて処理する大容量版と、旧式の生産性互換機能を追加します。材料の量、生産量、製作時間は同じ比率で増減します。デフォルトでは無効です。
load-furn-energy=製錬炉のエネルギー消費量にこの値を掛けます。デフォルト: 1。範囲: 0.1～5。
load-furn-crafting-speed=製錬炉の製作速度の調整値です。旧式の一括製錬が無効の場合、ベルトに基づく速度をこの値で割ります。旧式モードでは、基本速度にこの値を掛けます。デフォルト: 1。範囲: 0.1～5。
load-furn-pollution-speed=製錬炉の汚染量にこの値を掛けます。製作速度の調整値も排出量に影響します。デフォルト: 1。範囲: 0.001～10。
loader-pro-use-trains=無効: 貨車の積み降ろしを行いません。自動運転のみ: 駅に停車中の自動運転列車に積み込みまたは荷降ろしを行います。停車中の全列車: 停車中の手動運転列車も対象です。東西南北に配置された貨車に対応します。デフォルト: 無効。
recipe-wood-to-coal=木材1個から10秒で生産する石炭の量です。木材から石炭への変換レシピが必要です。デフォルト: 8。範囲: 1～200。
steel-plate2=鉄鉱石から直接鋼材を作る上位製錬炉のレシピを有効にします。デフォルトでは有効です。
cool=木材を石炭に変換するレシピを有効にします。デフォルトでは有効です。
load-furn-balance-mode=製錬炉の研究の進行方式を選択します。オリジナルでは元の要件を維持します。拡張用の設定では、そのサイエンスパックと前提条件を追加します。拡張がない場合は利用可能な内容に切り替え、要件を解決できない場合は元の研究を維持します。完了済みの研究は保持されます。
load-furn-steel-yield=鉄鉱石5個から16秒で生産する鋼材の量です。直接製鋼が必要です。デフォルト: 1。範囲: 1～100。旧式の一括製錬では材料、時間、生産量が同じ比率で増減します。
load-furn-extra-smelting=導入済みMODの適切な鉱石から金属板への製錬レシピを上位製錬炉で使用可能にし、適切な含鉄鉱石から直接鋼材を作る代替レシピを追加します。鉱石の量と合計製作時間を維持します。元の技術と最初の上位製錬炉の両方が必要です。流体、ランダムな生産物、副産物、リサイクル、化学工程は対象外です。デフォルトでは無効です。

