[mod-setting-description]
load-furn-easy-research=םינשבכה תויגולונכט לש רקחמה תולע תא תיחפמ\n.לדחמ תרירבכ תבשומ .םימדקתמה
logist=.םילולכה PRO יעוסמ תאו םיסימעמה תוגרד תא ליעפמ\n.לדחמ תרירבכ לעפומ
load-furn-legacy=הכתהה ינוכתמ לש רתוי תולודג תווצאב םיקתוע ףיסומ\nתויומכ .הנשיה הסרגהמ ןוירפל תומיאתו םיכמתנה\n.סחי ותואב םינתשמ רוצייה ןמזו הקופתה ,םיביכרמה\n.לדחמ תרירבכ תבשומ
load-furn-energy=.1 :לדחמ תרירב .ןשבכה לש היגרנאה תכירצ תא ליפכמ\n.5 דע 0.1 :חווט
load-furn-crafting-speed=הסרגהמ תווצא אלל .ןשבכה לש רוצייה תוריהמל םדקמ\n.הז ךרעב תקלוחמ עוסמהמ תרזגנה תוריהמה ,הנשיה\n:לדחמ תרירב .וב תלפכומ סיסבה תוריהמ ,ןשיה בצמב\n.5 דע 0.1 :חווט .1
load-furn-pollution-speed=עיפשמ רוצייה תוריהמ םדקמ .ןשבכה םוהיז תא ליפכמ\n.10 דע 0.001 :חווט .1 :לדחמ תרירב .תוטילפה לע םג
loader-pro-use-trains=סימעמ :דבלב תויטמוטוא .תונורק תסמעה אלל :תבשומ\nתובכרה לכ .הנחתב ורצעש תויטמוטוא תובכר קרופ וא\nרודיסב ךמות .ורצעש תוינדי תובכר םג ללוכ :ורצעש\n:לדחמ תרירב .םיישארה ןפצמה ינוויכ תעבראב תונורק\n.תבשומ
recipe-wood-to-coal=תא שרוד .תוינש 10 ךותב ץע 1־מ תרצוימה םחפה תומכ\nדע 1 :חווט .8 :לדחמ תרירב .םחפל ץע תרמהל ןוכתמה\n.200
steel-plate2=תורישי הדלפ רוצייל םדקתמה ןשבכה ןוכתמ תא ליעפמ\n.לדחמ תרירבכ לעפומ .לזרב תרפעמ
cool=תרירבכ לעפומ .םחפל ץע תרמהל ןוכתמה תא ליעפמ\n.לדחמ
load-furn-balance-mode=לולסמה .םינשבכה רקחמ תומדקתה לולסמ תא רחוב\nתובחרהה יליפורפ .תוירוקמה תושירדה לע רמוש ירוקמה\n.ןהלש םדקה תושירד תאו עדמה תוליבח תא םיפיסומ\nאלש תושירד ;ןימזה ןכותב תופלחומ תורסח תובחרה\nםירקחמ .ירוקמה רקחמה תא תוריאשמ רותפל ןתינ\n.םירמשנ ומלשוהש
load-furn-steel-yield=16 ךותב לזרב תורפע 5־מ םירצוימה הדלפה תוחול\n.1 :לדחמ תרירב .הרישי הדלפ תכתה שרוד .תוינש\nתויומכ תא תונשמ תונשיה תווצאה .100 דע 1 :חווט\n.סחי ותואב הקופתהו ןמזה ,םיביכרמה
load-furn-extra-smelting=תרמהל םימיאתמ םינוכתמ םימדקתמה םינשבכב רשפאמ\nרוצייל תופולח ףיסומו ,םינקתומ םידוממ תוחולל הרפע\nלע רמוש .לזרב תוליכמה תומיאתמ תורפעמ תורישי הדלפ\nתא םג שרוד .ללוכה רוצייה ןמז לעו הרפעה תויומכ\n.ןושארה םדקתמה ןשבכה תא םגו רוקמה תויגולונכט\n,יאוול ירצות ,תויארקא תואצות ,םילזונ ללוכ וניא\n.לדחמ תרירבכ תבשומ .םיימיכ םיכילהתו רוזחימ

